2em;color:var(--green);text-transform:none}\n.muted{color:var(--muted)}\n\n/* buttons */\n.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:8px;font-size:14px;font-weight:500;letter-spacing:-0.01em;cursor:pointer;border:1px solid transparent;transition:.15s ease;white-space:nowrap}\n.btn-green{background:var(--green);color:#121212;border-color:var(--green)}\n.btn-green:hover{background:#4ade9c}\n.btn-ghost{background:transparent;color:var(--fg);border-color:var(--border)}\n.btn-ghost:hover{background:#262626;border-color:#3d3d3d}\n.btn-lg{height:44px;padding:0 22px;font-size:15px}\n\n/* nav */\nheader{position:sticky;top:0;z-index:50;background:rgba(28,28,28,.8);backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--border-soft)}\nnav{display:flex;align-items:center;gap:28px;height:64px;max-width:var(--max);margin:0 auto;padding:0 24px}\n.logo{display:flex;align-items:center;gap:9px;font-weight:500;font-size:15px;letter-spacing:-0.02em}\n.logo .mark{width:26px;height:26px;border-radius:7px;display:block;object-fit:contain}\n.nav-links{display:flex;gap:24px;margin-left:8px}\n.nav-links a{font-size:14px;color:var(--fg-2);transition:.15s}\n.nav-links a:hover{color:var(--fg)}\n.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}\n.nav-right .login{font-size:14px;color:var(--fg-2);padding:0 6px}\n.nav-right .login:hover{color:var(--fg)}\n.burger{display:none;margin-left:auto;background:none;border:none;width:40px;height:40px;color:var(--fg);font-size:24px;line-height:1;cursor:pointer;padding:0}\n#mobile-menu{display:none;border-bottom:1px solid var(--border);background:var(--bg-2);padding:12px 24px}\n#mobile-menu a{display:block;padding:11px 0;font-size:15px;color:var(--fg-2);border-bottom:1px solid var(--border-soft)}\n#mobile-menu .btn{margin-top:14px;width:100%;display:flex;align-items:center;justify-content:center;color:#121212;border-bottom:none}\n\n/* hero */\n.hero{text-align:center;padding:96px 0 72px;position:relative;overflow:hidden}\n.hero::before{content:\"\";position:absolute;top:-200px;left:50%;transform:translateX(-50%);width:900px;height:500px;background:radial-gradient(ellipse at center,rgba(62,207,142,.12),transparent 65%);pointer-events:none}\n.hero .eyebrow{display:inline-block;margin-bottom:22px;position:relative}\n.hero h1{font-size:clamp(2.6rem,6.2vw,4.7rem);font-weight:500;line-height:1.04;letter-spacing:-0.045em;color:#fff;max-width:14ch;margin:0 auto}\n.hero h1 .grad{background:linear-gradient(90deg,var(--green),#7fe9bd);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}\n.hero p.sub{margin:26px auto 0;max-width:600px;font-size:clamp(1rem,1.4vw,1.18rem);color:#fff;font-weight:300;line-height:1.6}\n.hero .cta{margin-top:34px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}\n.hero .note{margin-top:18px;font-family:var(--mono);font-size:12.5px;color:var(--dim)}\n\n/* dashboard mockup */\n.mockup{margin:64px auto 0;max-width:980px;position:relative}\n.mockup-frame{background:linear-gradient(180deg,#222,#1a1a1a);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 40px 120px -30px rgba(0,0,0,.7)}\n.mock-bar{display:flex;align-items:center;gap:7px;padding:13px 16px;border-bottom:1px solid var(--border)}\n.mock-bar i{width:11px;height:11px;border-radius:50%;background:#3a3a3a;display:block}\n.mock-bar .url{margin-left:14px;font-family:var(--mono);font-size:12px;color:var(--dim);background:#161616;border:1px solid var(--border);border-radius:8px;padding:4px 12px}\n.mock-body{display:grid;grid-template-columns:200px 1fr;min-height:340px}\n.mock-side{border-right:1px solid var(--border);padding:18px 14px;background:#1a1a1a}\n.mock-side .si{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;font-size:13px;color:var(--muted);margin-bottom:3px}\n.mock-side .si.on{background:var(--green-dim);color:var(--green)}\n.mock-side .si b{width:14px;height:1 ize:16px;font-weight:500;color:#fff;letter-spacing:-0.02em;margin-bottom:8px}\n.card p{font-size:14px;color:var(--muted);line-height:1.58}\n\n/* split product */\n.split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}\n.split ul{list-style:none;margin-top:24px;display:flex;flex-direction:column;gap:14px}\n.split li{display:flex;gap:12px;font-size:15px;color:var(--fg-2);line-height:1.5}\n.split li .ck{flex:none;width:20px;height:20px;border-radius:50%;background:var(--green-dim);color:var(--green);display:grid;place-items:center;font-size:12px;margin-top:1px}\n.panel-visual{background:linear-gradient(180deg,#222,#1a1a1a);border:1px solid var(--border);border-radius:12px;padding:22px;min-height:300px}\n.pv-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#1f1f1f;border:1px solid var(--border);border-radius:8px;margin-bottom:10px}\n.pv-row .who{display:flex;align-items:center;gap:11px}\n.pv-row .av{width:30px;height:30px;border-radius:50%;background:var(--green-dim);color:var(--green);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:500}\n.pv-row .nm{font-size:13.5px;color:var(--fg)}\n.pv-row .nm small{display:block;color:var(--dim);font-size:11.5px;font-family:var(--mono)}\n.pv-row .tag{font-size:11px;font-family:var(--mono);padding:3px 9px;border-radius:12px;background:var(--green-dim);color:var(--green)}\n.pv-row .tag.pend{background:rgba(255,255,255,.06);color:var(--muted)}\n\n/* pricing */\n.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:start}\n.price{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:30px 26px;display:flex;flex-direction:column}\n.price.pop{border-color:var(--green);box-shadow:0 0 0 1px var(--green),0 30px 80px -40px rgba(62,207,142,.4)}\n.price .pname{font-size:15px;font-weight:500;color:#fff;display:flex;align-items:center;gap:10px}\n.price .badge{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:#121212;background:var(--green);padding:3px 8px;border-radius:12px}\n.price .pdesc{font-size:13.5px;color:var(--muted);margin-top:8px;min-height:38px}\n.price .amt{margin:20px 0 4px;font-size:42px;font-weight:500;color:#fff;letter-spacing:-0.04em}\n.price .amt span{font-size:15px;color:var(--muted);font-weight:400;letter-spacing:0}\n.price .per{font-size:12.5px;color:var(--dim);font-family:var(--mono);margin-bottom:22px}\n.price .btn{width:100%;justify-content:center;margin-bottom:24px}\n.price ul{list-style:none;display:flex;flex-direction:column;gap:11px}\n.price li{display:flex;gap:10px;font-size:13.5px;color:var(--fg-2)}\n.price li .ck{flex:none;color:var(--green);font-size:13px;margin-top:1px}\n\n/* faq */\n.faq{max-width:760px;margin:0 auto}\n.faq details{border-bottom:1px solid var(--border);padding:4px 0}\n.faq summary{list-style:none;cursor:pointer;padding:20px 4px;font-size:16px;font-weight:500;color:var(--fg);display:flex;justify-content:space-between;align-items:center;gap:16px}\n.faq summary::-webkit-details-marker{display:none}\n.faq summary .pl{color:var(--green);font-size:20px;transition:.2s;flex:none}\n.faq details[open] summary .pl{transform:rotate(45deg)}\n.faq .ans{padding:0 4px 22px;color:var(--muted);font-size:14.5px;line-height:1.65;max-width:90%}\n\n/* final cta */\n.final{text-align:center;padding:96px 0;position:relative;overflow:hidden}\n.final::before{content:\"\";position:absolute;bottom:-220px;left:50%;transform:translateX(-50%);width:800px;height:480px;background:radial-gradient(ellipse at center,rgba(62,207,142,.13),transparent 65%)}\n.final h2{font-size:clamp(2rem,4vw,3.1rem);font-weight:500;letter-spacing:-0.04em;color:#fff;line-height:1.08;position:relative}\n.final p{margin:20px auto 0;max-width:520px;color:var(--muted);font-size:1.08rem;position:relative}\n.final .cta{margin-top:32px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;position:relative}\n\n/* footer */\nfooter{border-top:1px solid var(--border);padding:60px 0 40px;background:var(--bg-2)}\n.foot-grid{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:40px}\n.foot-brand .logo{margin-bottom:14px}\n.foot-brand p{font-size:13.5px;color:var(--dim);max-width:260px;line-height:1.6}\n.foot-col h5{font-family:var(--mono);font-size:12px;color:var(--fg);text-transform:uppercase;letter-spacing:.03em;margin-bottom:16px}\n.foot-col a{display:block;font-size:14px;color:var(--muted);padding:6px 0;transition:.15s}\n.foot-col a:hover{color:var(--green)}\n.foot-bottom{max-width:var(--max);margin:48px auto 0;padding:24px 24px 0;border-top:1px solid var(--border-soft);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--dim)}\n.foot-bottom a:hover{color:var(--green)}\n\n@media(max-width:880px){\n  .nav-links{display:none}.nav-right{display:none}.burger{display:block}\n  .mock-body{grid-template-columns:1fr}.mock-side{display:none}\n  .grid{grid-template-columns:1fr}.split{grid-template-columns:1fr;gap:32px}\n  .prices{grid-template-columns:1fr;max-width:420px;margin:0 auto}\n  .foot-grid{grid-template-columns:1fr 1fr;gap:32px}.foot-brand{grid-column:1/-1}\n  .hero{padding:64px 0 48px}.mock-stats{grid-template-columns:1fr}\n}\n\n/* base typographique uniforme */\nhtml{font-size:15px}\nbody{font-size:15px}\n\nstrong,b{font-weight:500}\n\n/* ===== ANIMATIONS PREMIUM (même DA, plus vivant) ===== */\n.hero .wrap{position:relative;z-index:1}\n.hero .mesh{position:absolute;top:-160px;left:50%;transform:translateX(-50%);width:1100px;height:640px;z-index:0;pointer-events:none;filter:blur(64px);opacity:.6}\n.hero .mesh b{position:absolute;display:block;border-radius:50%;mix-blend-mode:screen}\n.hero .mesh b:nth-child(1){width:460px;height:460px;background:radial-gradient(circle,rgba(62,207,142,.55),transparent 62%);top:0;left:6%}\n.hero .mesh b:nth-child(2){width:380px;height:380px;background:radial-gradient(circle,rgba(36,180,126,.45),trans
