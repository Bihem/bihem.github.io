<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#1D1B1B;--white:#FFFFFF;--dim:rgba(255,255,255,0.45);--line:rgba(255,255,255,0.08);--F:'Space Grotesk',Arial,sans-serif}
html{font-size:16px;height:100%}
body{background:var(--bg);color:var(--white);font-family:var(--F);font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;transition:background .25s,color .25s}
body.light{background:#FFFFFF;color:#000000;--bg:#FFFFFF;--white:#000000;--dim:rgba(0,0,0,0.5);--line:rgba(0,0,0,0.1)}
a{color:inherit;text-decoration:none}

.err-code{font-size:clamp(80px,20vw,180px);font-weight:700;line-height:1;opacity:0.08;letter-spacing:-0.04em;user-select:none;position:absolute}
.err-wrap{position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:32px}
.err-label{font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--dim);position:relative;z-index:1}
h1{font-size:clamp(28px,5vw,48px);font-weight:700;letter-spacing:-0.02em;margin-bottom:16px;line-height:1.1}
.err-sub{font-size:16px;color:var(--dim);max-width:420px;margin:0 auto 40px}
.err-links{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.btn-home{background:var(--white);color:var(--bg);border:none;border-radius:100px;padding:14px 32px;font-family:var(--F);font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;transition:opacity .2s}
.btn-home:hover{opacity:0.8}
.btn-back{background:none;border:1px solid var(--line);border-radius:100px;padding:14px 32px;font-family:var(--F);font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);cursor:pointer;transition:border-color .2s,color .2s}
.btn-back:hover{border-color:var(--white);color:var(--white)}
body.light .btn-back:hover{border-color:#000;color:#000}
</style>

<body>
<div class="err-wrap">
  <span class="err-code" aria-hidden="true">404</span>
  <span class="err-label">Page introuvable</span>
</div>
<h1>Cette page n'existe pas.</h1>
<p class="err-sub">Le lien est peut-être cassé, ou la page a été déplacée. Pas de panique — retourne à l'accueil.</p>
<div class="err-links">
  <a href="index.html" class="btn-home">← Retour à l'accueil</a>
  <a href="projets.html" class="btn-back">Voir les projets</a>
</div>

<script>
(function(){
  const stored = localStorage.getItem('dikenga-theme');
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const useDark = stored ? stored === 'dark' : false;
  if(!useDark) document.body.classList.add('light');
})();
/* Auto-redirect après 10s */
let countdown = 10;
const timer = setInterval(() => {
  countdown--;
  if(countdown <= 0){ clearInterval(timer); window.location.href = 'index.html'; }
}, 1000);
</script>
