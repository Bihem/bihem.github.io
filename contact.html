@font-face{font-family:'Suisse Intl';src:url('https://cdn.prod.website-files.com/6772f6efe246aaaa73ad2a98/67784f5e4c3068c2e2f22e60_SuisseIntl-Regular.otf')format('opentype');font-weight:400;font-style:normal;font-display:swap}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1D1B1B;
  --white:#fff;
  --dim:rgba(255,255,255,0.38);
  --line:rgba(255,255,255,0.12);
  --SI:'Suisse Intl','Space Grotesk',sans-serif;
}
html{min-height:100%;overflow-x:hidden;background:transparent}
body{
  background:var(--bg);
  color:var(--white);font-family:var(--SI);font-weight:300;
  -webkit-font-smoothing:antialiased;cursor:none;
}
a,button{cursor:none;text-decoration:none;color:inherit}
/* ── ENTRÉE PAGE — désactivée */
.page-enter{display:none}
/* PAGE TRANSITION SORTIE */
.page-transition{display:none}

/* CURSOR */
#cdot{position:fixed;z-index:9999;pointer-events:none;width:6px;height:6px;border-radius:50%;background:var(--white);transform:translate(-50%,-50%)}
#cring{position:fixed;z-index:9998;pointer-events:none;width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,0.4);transform:translate(-50%,-50%);transition:width .22s,height .22s}
.cursor-grow #cring{width:50px;height:50px}

/* NAV */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:800;
  display:flex;align-items:center;justify-content:space-between;
  padding:26px 48px;
}
.nav-logo svg{height:28px;width:auto}
.nav-time{font-size:10px;font-weight:300;letter-spacing:.1em;text-transform:uppercase;color:var(--white)}
.nav-back{
  display:flex;align-items:center;gap:8px;
  font-size:11px;font-weight:300;letter-spacing:.12em;text-transform:uppercase;
  color:var(--white);transition:opacity .2s;
}
.nav-back:hover{opacity:.7}

/* LAYOUT */
.wrap{
  display:grid;
  grid-template-columns:1fr 1fr;
  min-height:100vh;
  padding-top:100px;
}

/* LEFT */
.left{
  padding:80px 60px 80px 48px;
  display:flex;flex-direction:column;justify-content:space-between;
  position:sticky;top:0;height:calc(100vh - 100px);overflow:hidden;
}
.left-top{}
.headline{
  font-family:var(--SI);
  font-size:clamp(56px,6vw,100px);
  font-weight:300;letter-spacing:-.04em;line-height:.9;
  margin-bottom:52px;
}
.desc{display:flex;flex-direction:column;gap:18px;max-width:380px}
.desc p{font-size:15px;font-weight:300;line-height:1.72;color:var(--white)}
.desc a{border-bottom:1px solid rgba(255,255,255,.2);transition:border-color .2s}
.desc a:hover{border-color:var(--white)}

/* contact links */
.clinks{margin-top:40px;display:flex;flex-direction:row;gap:14px;flex-wrap:wrap}
.clink{
  width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);
  color:var(--white);
  background:rgba(255,255,255,0.05);
  transition:background .2s,border-color .2s,transform .2s;
  text-decoration:none;flex-shrink:0;
}
.clink:hover{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.35);transform:translateY(-3px)}
.clink-insta,.clink-linkedin{border-color:transparent!important;background:none!important;padding:0;overflow:hidden}
.clink-insta:hover,.clink-linkedin:hover{opacity:.85;transform:translateY(-3px);background:none!important}
.clink-val{display:none}

.left-foot{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--white)}

/* RIGHT */
.right{
  padding:80px 48px 80px 60px;
  border-left:1px solid var(--line);
  display:flex;flex-direction:column;
}
.form-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--white);margin-bottom:44px}

/* FORM GRID */
.c-form{display:flex;flex-direction:column;gap:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 48px}

/* FIELD */
.field{
  border-bottom:1px solid var(--line);
  padding-top:26px;
  transition:border-color .3s;
}
.field:focus-within{border-color:rgba(255,255,255,.4)}
.field.full{grid-column:1/-1}

.field label{
  display:block;font-size:13px;font-weight:400;
  letter-spacing:.12em;text-transform:uppercase;
  color:var(--white);margin-bottom:14px;
}

.field input,
.field textarea,
.field select{
  width:100%;background:none;border:none;outline:none;
  font-family:var(--SI);font-size:22px;font-weight:300;
  color:var(--white);padding:0 0 26px;
  line-height:1.4;caret-color:var(--white);
}
.field textarea{resize:none;min-height:110px}
.field select{appearance:none;-webkit-appearance:none}
.field select option{background:#1D1B1B;color:var(--white)}
.field input::placeholder,
.field textarea::placeholder{color:rgba(255,255,255,.18)}
.sel-wrap{position:relative}
.sel-wrap::after{content:'↓';position:absolute;right:0;bottom:24px;font-size:13px;color:var(--white);pointer-events:none}

/* BOTTOM */
.form-foot{
  display:flex;align-items:center;justify-content:space-between;
  padding:28px 0 0;flex-wrap:wrap;gap:16px;
}
.check-row{display:flex;align-items:center;gap:12px;cursor:none}
.check-box{
  width:18px;height:18px;border:1px solid rgba(255,255,255,.22);border-radius:3px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:background .2s,border-color .2s;
}
.check-row input[type=checkbox]{display:none}
.check-row input[type=checkbox]:checked+.check-box{background:var(--white);border-color:var(--white)}
.check-row input[type=checkbox]:checked+.check-box::after{content:'✓';font-size:10px;color:#1D1B1B;font-weight:700}
.check-label{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--white)}

.btn-submit{
  display:inline-flex;align-items:center;gap:10px;
  padding:18px 40px;border-radius:100px;
  background:var(--white);color:#1D1B1B;
  font-family:var(--SI);font-size:17px;font-weight:400;
  letter-spacing:.1em;text-transform:uppercase;
  border:none;transition:opacity .2s,transform .2s;
}
.btn-submit:hover{opacity:.85;transform:scale(1.02)}

/* PAGE TRANSITIONS — handled via body animation */

/* ── MOBILE */
@media(max-width:900px){
  #cdot,#cring{display:none}
  body{cursor:auto}
  a,button{cursor:auto}

  .nav{padding:16px 20px;gap:12px}
  .nav-logo svg{height:22px}
  .nav-time{display:none}
  /* Cacher Blog + À propos sur mobile — garder logo + retour */
  .nav > a:not(.nav-logo):not(.nav-back){display:none}

  .wrap{
    grid-template-columns:1fr;
    padding-top:72px;
  }

  .left{
    position:static;height:auto;
    padding:32px 20px 40px;
    border-bottom:1px solid var(--line);
  }
  .headline{font-size:clamp(40px,11vw,68px);margin-bottom:28px}
  .desc p{font-size:14px}
  .clinks{margin-top:32px}
  .clink{padding:12px 0}
  .clink-val{font-size:11px}
  .left-foot{margin-top:32px}

  .right{
    padding:40px 20px 80px;
    border-left:none;
  }
  .row{grid-template-columns:1fr}
  .field{padding-top:20px}
  .field input,.field textarea,.field select{font-size:15px;padding:0 0 16px}
  .field textarea{min-height:90px}

  .form-foot{flex-direction:column;align-items:flex-start;gap:20px}
}

<script>
/* cursor */
const dot=document.getElementById('cdot'),ring=document.getElementById('cring');
let mx=window.innerWidth/2,my=window.innerHeight/2,rx=mx,ry=my;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
(function loop(){
  dot.style.left=mx+'px';dot.style.top=my+'px';
  rx+=(mx-rx)*.12;ry+=(my-ry)*.12;
  ring.style.left=rx+'px';ring.style.top=ry+'px';
  requestAnimationFrame(loop);
})();
document.querySelectorAll('a,button,label').forEach(el=>{
  el.addEventListener('mouseenter',()=>document.body.classList.add('cursor-grow'));
  el.addEventListener('mouseleave',()=>document.body.classList.remove('cursor-grow'));
});

/* clock */
function tick(){
  const n=new Date();
  document.getElementById('navtime').textContent='FR · '+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
}
tick();setInterval(tick,1000);

/* checkbox */
document.querySelectorAll('.check-row').forEach(row=>{
  row.addEventListener('click',()=>{const cb=row.querySelector('input[type=checkbox]');if(cb)cb.checked=!cb.checked});
});

/* form */
document.getElementById('contactForm').addEventListener('submit',async function(e){
  e.preventDefault();
  const btn=document.getElementById('submitBtn');
  btn.textContent='Envoi…';btn.disabled=true;
  try{
    const res=await fetch(this.action,{method:'POST',body:new FormData(this),headers:{Accept:'application/json'}});
    btn.textContent=res.ok?'Message reçu ✓':'Erreur — réessayez';
    if(res.ok)this.reset();
    else btn.disabled=false;
  }catch{btn.textContent='Erreur — réessayez';btn.disabled=false;}
});

/* révèle la page */
(function(){const e=document.getElementById('pageEnter');if(e)e.style.display='none';})();

/* retour accueil — overlay slide bas */
function goHome(e){
  e.preventDefault();
  window.location.href='index.html';
}

/* ── THEME — restaurer depuis localStorage ou préférence système */
(function(){
  const stored = localStorage.getItem('dikenga-theme');
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const useDark = stored ? stored === 'dark' : true;
  if(!useDark){
    document.documentElement.style.setProperty('--bg','#FFFFFF');
    document.documentElement.style.setProperty('--white','#000000');
    document.documentElement.style.setProperty('--dim','rgba(0,0,0,0.5)');
    document.documentElement.style.setProperty('--line','rgba(0,0,0,0.1)');
    document.body.classList.add('light');
    document.querySelector('html').style.background = '#FFFFFF';
  }
  if(!stored && window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if(!localStorage.getItem('dikenga-theme')) location.reload();
    });
  }
})();
</script>
