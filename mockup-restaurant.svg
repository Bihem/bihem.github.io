<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A0A00"/>
      <stop offset="100%" stop-color="#2C1206"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2C1206"/>
      <stop offset="100%" stop-color="#1A0A00"/>
    </linearGradient>
    <clipPath id="roundClip">
      <rect width="1200" height="900" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundClip)">
    <!-- Background -->
    <rect width="1200" height="900" fill="#FAF7F2"/>

    <!-- NAV -->
    <rect width="1200" height="64" fill="#FAF7F2"/>
    <rect x="0" y="63" width="1200" height="1" fill="#E8E4DC"/>
    <!-- Logo -->
    <text x="64" y="40" font-family="Georgia,serif" font-size="20" font-weight="bold" fill="#1A0A00" letter-spacing="3">OSTERIA</text>
    <text x="64" y="55" font-family="Georgia,serif" font-size="9" fill="#8B6F5E" letter-spacing="6">MILANO</text>
    <!-- Nav links -->
    <text x="520" y="38" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#3D2B1F" letter-spacing="2">MENU</text>
    <text x="620" y="38" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#3D2B1F" letter-spacing="2">RÉSERVER</text>
    <text x="740" y="38" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#3D2B1F" letter-spacing="2">HISTOIRE</text>
    <text x="855" y="38" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#3D2B1F" letter-spacing="2">CONTACT</text>
    <!-- CTA button -->
    <rect x="1036" y="20" width="120" height="36" rx="2" fill="#C0161E"/>
    <text x="1096" y="43" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="white" text-anchor="middle" letter-spacing="1">RÉSERVER</text>

    <!-- HERO SECTION -->
    <rect x="0" y="64" width="1200" height="480" fill="url(#heroGrad)"/>
    <!-- Decorative circle -->
    <circle cx="900" cy="310" r="300" fill="none" stroke="#C0161E" stroke-width="0.5" opacity="0.3"/>
    <circle cx="900" cy="310" r="220" fill="none" stroke="#C0161E" stroke-width="0.5" opacity="0.2"/>

    <!-- Plate illustration (simplified elegant) -->
    <circle cx="880" cy="310" r="180" fill="#2C1206" opacity="0.6"/>
    <circle cx="880" cy="310" r="165" fill="none" stroke="#8B6F5E" stroke-width="1" opacity="0.4"/>
    <circle cx="880" cy="310" r="130" fill="#3D1A08" opacity="0.8"/>
    <!-- Food elements -->
    <ellipse cx="880" cy="310" rx="80" ry="60" fill="#6B3A2A" opacity="0.9"/>
    <ellipse cx="855" cy="295" rx="30" ry="20" fill="#8B2020" opacity="0.8"/>
    <ellipse cx="905" cy="325" rx="25" ry="18" fill="#5C3A1E" opacity="0.9"/>
    <circle cx="870" cy="300" r="8" fill="#C0161E" opacity="0.9"/>
    <circle cx="895" cy="318" r="6" fill="#D4A030" opacity="0.8"/>
    <!-- Herb garnish -->
    <ellipse cx="860" cy="285" rx="12" ry="5" fill="#2D5A27" transform="rotate(-30 860 285)"/>
    <ellipse cx="875" cy="280" rx="10" ry="4" fill="#2D5A27" transform="rotate(15 875 280)"/>

    <!-- Hero text -->
    <text x="120" y="200" font-family="Georgia,serif" font-size="14" fill="#D4A030" letter-spacing="4">— CUISINE ITALIENNE AUTHENTIQUE</text>
    <text x="120" y="265" font-family="Georgia,serif" font-size="68" fill="#FAF7F2" letter-spacing="-1">L'Art de</text>
    <text x="120" y="345" font-family="Georgia,serif" font-size="68" fill="#FAF7F2" font-style="italic">la Table.</text>
    <text x="120" y="400" font-family="'Helvetica Neue',sans-serif" font-size="16" fill="rgba(250,247,242,0.6)" letter-spacing="0.5">Une expérience gastronomique inoubliable,</text>
    <text x="120" y="422" font-family="'Helvetica Neue',sans-serif" font-size="16" fill="rgba(250,247,242,0.6)" letter-spacing="0.5">au cœur de Paris depuis 1987.</text>
    <!-- CTA buttons -->
    <rect x="120" y="450" width="180" height="50" rx="2" fill="#C0161E"/>
    <text x="210" y="481" font-family="'Helvetica Neue',sans-serif" font-size="13" fill="white" text-anchor="middle" letter-spacing="2">RÉSERVER</text>
    <rect x="318" y="450" width="160" height="50" rx="2" fill="none" stroke="rgba(250,247,242,0.4)" stroke-width="1"/>
    <text x="398" y="481" font-family="'Helvetica Neue',sans-serif" font-size="13" fill="rgba(250,247,242,0.7)" text-anchor="middle" letter-spacing="2">VOIR LE MENU</text>

    <!-- MENU SECTION -->
    <rect x="0" y="544" width="1200" height="356" fill="#FAF7F2"/>
    <!-- Section title -->
    <text x="600" y="596" font-family="Georgia,serif" font-size="11" fill="#C0161E" text-anchor="middle" letter-spacing="4">— NOS SPÉCIALITÉS —</text>
    <text x="600" y="636" font-family="Georgia,serif" font-size="38" fill="#1A0A00" text-anchor="middle">La Carte du Soir</text>

    <!-- Menu cards -->
    <!-- Card 1 -->
    <rect x="64" y="668" width="330" height="160" rx="4" fill="white"/>
    <rect x="64" y="668" width="330" height="4" rx="4" fill="#C0161E"/>
    <rect x="64" y="668" width="90" height="160" rx="4" fill="#2C1206"/>
    <!-- Plate icon -->
    <circle cx="109" cy="748" r="28" fill="none" stroke="#D4A030" stroke-width="1.5" opacity="0.6"/>
    <circle cx="109" cy="748" r="18" fill="#3D1A08"/>
    <text x="109" y="753" font-family="Georgia,serif" font-size="16" fill="#D4A030" text-anchor="middle">✦</text>
    <text x="200" y="710" font-family="Georgia,serif" font-size="18" fill="#1A0A00">Risotto Truffe</text>
    <text x="200" y="732" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="#8B6F5E">Risotto crémeux, truffe noire,</text>
    <text x="200" y="748" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="#8B6F5E">parmesan 36 mois, herbes fraîches</text>
    <text x="200" y="790" font-family="Georgia,serif" font-size="22" fill="#C0161E">38 €</text>
    <text x="348" y="790" font-family="'Helvetica Neue',sans-serif" font-size="10" fill="#C0161E" text-anchor="end">Commander →</text>

    <!-- Card 2 -->
    <rect x="434" y="668" width="330" height="160" rx="4" fill="#1A0A00"/>
    <rect x="434" y="668" width="330" height="4" rx="4" fill="#D4A030"/>
    <rect x="434" y="668" width="90" height="160" rx="4" fill="#2C1206"/>
    <circle cx="479" cy="748" r="28" fill="none" stroke="#D4A030" stroke-width="1.5" opacity="0.6"/>
    <circle cx="479" cy="748" r="18" fill="#3D1A08"/>
    <text x="479" y="753" font-family="Georgia,serif" font-size="16" fill="#D4A030" text-anchor="middle">✦</text>
    <text x="570" y="710" font-family="Georgia,serif" font-size="18" fill="#FAF7F2">Veau Saltimbocca</text>
    <text x="570" y="732" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="rgba(250,247,242,0.55)">Escalope de veau, jambon cru,</text>
    <text x="570" y="748" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="rgba(250,247,242,0.55)">sauge, beurre clarifié</text>
    <text x="570" y="790" font-family="Georgia,serif" font-size="22" fill="#D4A030">42 €</text>
    <text x="748" y="790" font-family="'Helvetica Neue',sans-serif" font-size="10" fill="#D4A030" text-anchor="end">Commander →</text>

    <!-- Card 3 -->
    <rect x="804" y="668" width="330" height="160" rx="4" fill="white"/>
    <rect x="804" y="668" width="330" height="4" rx="4" fill="#C0161E"/>
    <rect x="804" y="668" width="90" height="160" rx="4" fill="#2C1206"/>
    <circle cx="849" cy="748" r="28" fill="none" stroke="#D4A030" stroke-width="1.5" opacity="0.6"/>
    <circle cx="849" cy="748" r="18" fill="#3D1A08"/>
    <text x="849" y="753" font-family="Georgia,serif" font-size="16" fill="#D4A030" text-anchor="middle">✦</text>
    <text x="940" y="710" font-family="Georgia,serif" font-size="18" fill="#1A0A00">Tiramisu Maison</text>
    <text x="940" y="732" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="#8B6F5E">Mascarpone, café Arabica,</text>
    <text x="940" y="748" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="#8B6F5E">cacao, biscuits savoiardi</text>
    <text x="940" y="790" font-family="Georgia,serif" font-size="22" fill="#C0161E">14 €</text>
    <text x="1118" y="790" font-family="'Helvetica Neue',sans-serif" font-size="10" fill="#C0161E" text-anchor="end">Commander →</text>

    <!-- Bottom bar -->
    <rect x="0" y="860" width="1200" height="40" fill="#1A0A00"/>
    <text x="600" y="886" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="rgba(250,247,242,0.4)" text-anchor="middle" letter-spacing="2">12 RUE DE LA PAIX · PARIS · TÉL : 01 42 XX XX XX · OUVERT TU–SA 19H–23H</text>
  </g>
</svg>
