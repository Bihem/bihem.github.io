<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="assurHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1B2D"/>
      <stop offset="100%" stop-color="#162236"/>
    </linearGradient>
    <linearGradient id="assurBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1A4FAD"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="assurCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <clipPath id="assurClip">
      <rect width="1200" height="900" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#assurClip)">
    <!-- Background -->
    <rect width="1200" height="900" fill="#F8FAFC"/>

    <!-- NAV -->
    <rect width="1200" height="68" fill="white"/>
    <rect x="0" y="67" width="1200" height="1" fill="#E2E8F0"/>
    <!-- Logo shield -->
    <path d="M56 18 L74 18 L74 44 Q65 50 56 44 Z" fill="#1A4FAD" opacity="0.15"/>
    <path d="M58 20 L72 20 L72 42 Q65 47 58 42 Z" fill="none" stroke="#1A4FAD" stroke-width="1.5"/>
    <text x="64" y="36" font-family="'Helvetica Neue',sans-serif" font-size="11" font-weight="700" fill="#1A4FAD" text-anchor="middle">A</text>
    <text x="84" y="32" font-family="'Helvetica Neue',sans-serif" font-size="15" font-weight="700" fill="#0F1B2D" letter-spacing="1">AXIOM</text>
    <text x="84" y="48" font-family="'Helvetica Neue',sans-serif" font-size="8" fill="#64748B" letter-spacing="3" font-weight="400">ASSURANCE</text>
    <!-- Nav links -->
    <text x="420" y="38" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#475569" letter-spacing="0.5">Particuliers</text>
    <text x="530" y="38" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#475569" letter-spacing="0.5">Entreprises</text>
    <text x="650" y="38" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#475569" letter-spacing="0.5">Santé</text>
    <text x="720" y="38" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#475569" letter-spacing="0.5">Auto</text>
    <text x="786" y="38" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#475569" letter-spacing="0.5">Habitation</text>
    <text x="898" y="38" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#475569" letter-spacing="0.5">Mon espace</text>
    <rect x="1020" y="20" width="136" height="36" rx="4" fill="url(#assurBlue)"/>
    <text x="1088" y="43" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="600">Devis gratuit</text>

    <!-- HERO -->
    <rect x="0" y="68" width="1200" height="420" fill="url(#assurHero)"/>

    <!-- Subtle grid pattern -->
    <line x1="0" y1="120" x2="1200" y2="120" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    <line x1="0" y1="280" x2="1200" y2="280" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    <line x1="200" y1="68" x2="200" y2="488" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    <line x1="600" y1="68" x2="600" y2="488" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    <line x1="1000" y1="68" x2="1000" y2="488" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

    <!-- Shield illustration (large) -->
    <path d="M870 120 L990 120 L990 280 Q930 320 870 280 Z" fill="rgba(37,99,235,0.08)"/>
    <path d="M880 128 L980 128 L980 274 Q930 310 880 274 Z" fill="none" stroke="rgba(37,99,235,0.25)" stroke-width="1.5"/>
    <path d="M895 138 L965 138 L965 268 Q930 298 895 268 Z" fill="none" stroke="rgba(37,99,235,0.12)" stroke-width="1"/>
    <!-- Check mark inside shield -->
    <path d="M905 215 L925 240 L960 195" stroke="rgba(37,99,235,0.5)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Hero text -->
    <text x="120" y="160" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="#60A5FA" letter-spacing="3" font-weight="500">PROTÉGEZ CE QUI COMPTE</text>
    <text x="118" y="230" font-family="Georgia,serif" font-size="58" fill="white" letter-spacing="-1">Assurance &amp;</text>
    <text x="118" y="300" font-family="Georgia,serif" font-size="58" fill="white" letter-spacing="-1" font-style="italic">Tranquillité.</text>
    <text x="118" y="345" font-family="'Helvetica Neue',sans-serif" font-size="14" fill="rgba(255,255,255,0.5)" font-weight="300">Des solutions adaptées à chaque étape de votre vie.</text>
    <text x="118" y="365" font-family="'Helvetica Neue',sans-serif" font-size="14" fill="rgba(255,255,255,0.5)" font-weight="300">Rapide, simple, transparent.</text>

    <!-- Trust badges -->
    <rect x="118" y="388" width="130" height="32" rx="4" fill="rgba(255,255,255,0.06)"/>
    <text x="183" y="409" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">✓ Certifié ACPR</text>
    <rect x="258" y="388" width="150" height="32" rx="4" fill="rgba(255,255,255,0.06)"/>
    <text x="333" y="409" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">✓ 50 000 clients</text>
    <rect x="418" y="388" width="150" height="32" rx="4" fill="rgba(255,255,255,0.06)"/>
    <text x="493" y="409" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">✓ Réponse 24h</text>

    <!-- QUOTE FORM (floating card) -->
    <rect x="118" y="428" width="460" height="80" rx="8" fill="white"/>
    <rect x="118" y="428" width="460" height="4" rx="8" fill="url(#assurBlue)"/>
    <!-- Form label -->
    <text x="140" y="456" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="#64748B" font-weight="500">Type d'assurance</text>
    <text x="300" y="456" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="#64748B" font-weight="500">Code postal</text>
    <rect x="136" y="462" width="144" height="30" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="208" y="482" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">Santé ▾</text>
    <rect x="292" y="462" width="144" height="30" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="364" y="482" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">75001</text>
    <rect x="448" y="460" width="114" height="34" rx="4" fill="url(#assurBlue)"/>
    <text x="505" y="483" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="600">Comparer →</text>

    <!-- OFFERS SECTION -->
    <rect x="0" y="488" width="1200" height="412" fill="#F8FAFC"/>

    <text x="600" y="536" font-family="'Helvetica Neue',sans-serif" font-size="10" fill="#1A4FAD" text-anchor="middle" letter-spacing="4" font-weight="600">NOS OFFRES</text>
    <text x="600" y="574" font-family="Georgia,serif" font-size="38" fill="#0F1B2D" text-anchor="middle">Choisissez votre couverture</text>

    <!-- Offer cards -->
    <!-- Card 1 - Essentiel -->
    <rect x="64" y="598" width="330" height="280" rx="8" fill="white" filter="url(#shadow)"/>
    <rect x="64" y="598" width="330" height="1" fill="#E2E8F0"/>
    <text x="229" y="645" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="#64748B" text-anchor="middle" letter-spacing="2" font-weight="600">ESSENTIEL</text>
    <text x="229" y="690" font-family="Georgia,serif" font-size="38" fill="#0F1B2D" text-anchor="middle">12 €</text>
    <text x="229" y="710" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">par mois</text>
    <line x1="100" y1="726" x2="358" y2="726" stroke="#F1F5F9" stroke-width="1"/>
    <text x="108" y="752" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#475569">✓  Hospitalisation</text>
    <text x="108" y="772" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#475569">✓  Médecin généraliste</text>
    <text x="108" y="792" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#CBD5E1">✗  Dentaire &amp; optique</text>
    <text x="108" y="812" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#CBD5E1">✗  Médecines douces</text>
    <rect x="100" y="836" width="258" height="38" rx="4" fill="#F1F5F9"/>
    <text x="229" y="861" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#1A4FAD" text-anchor="middle" font-weight="600">Choisir</text>

    <!-- Card 2 - Confort (featured) -->
    <rect x="434" y="588" width="330" height="290" rx="8" fill="url(#assurBlue)"/>
    <rect x="434" y="588" width="330" height="4" rx="8" fill="rgba(255,255,255,0.3)"/>
    <text x="534" y="598" font-family="'Helvetica Neue',sans-serif" font-size="9" fill="white" letter-spacing="2" font-weight="700" text-anchor="middle">⭐ RECOMMANDÉ</text>
    <text x="599" y="642" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle" letter-spacing="2" font-weight="600">CONFORT</text>
    <text x="599" y="688" font-family="Georgia,serif" font-size="38" fill="white" text-anchor="middle">28 €</text>
    <text x="599" y="708" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">par mois</text>
    <line x1="470" y1="724" x2="728" y2="724" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="478" y="750" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="rgba(255,255,255,0.85)">✓  Hospitalisation</text>
    <text x="478" y="770" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="rgba(255,255,255,0.85)">✓  Médecin généraliste</text>
    <text x="478" y="790" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="rgba(255,255,255,0.85)">✓  Dentaire &amp; optique 150%</text>
    <text x="478" y="810" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="rgba(255,255,255,0.6)">✗  Médecines douces</text>
    <rect x="470" y="830" width="258" height="38" rx="4" fill="white"/>
    <text x="599" y="855" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#1A4FAD" text-anchor="middle" font-weight="700">Choisir</text>

    <!-- Card 3 - Premium -->
    <rect x="804" y="598" width="330" height="280" rx="8" fill="white"/>
    <rect x="804" y="598" width="330" height="1" fill="#E2E8F0"/>
    <text x="969" y="645" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="#64748B" text-anchor="middle" letter-spacing="2" font-weight="600">PREMIUM</text>
    <text x="969" y="690" font-family="Georgia,serif" font-size="38" fill="#0F1B2D" text-anchor="middle">48 €</text>
    <text x="969" y="710" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">par mois</text>
    <line x1="840" y1="726" x2="1098" y2="726" stroke="#F1F5F9" stroke-width="1"/>
    <text x="848" y="752" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#475569">✓  Hospitalisation</text>
    <text x="848" y="772" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#475569">✓  Médecin généraliste</text>
    <text x="848" y="792" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#475569">✓  Dentaire &amp; optique 200%</text>
    <text x="848" y="812" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#475569">✓  Médecines douces</text>
    <rect x="840" y="836" width="258" height="38" rx="4" fill="#F1F5F9"/>
    <text x="969" y="861" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#1A4FAD" text-anchor="middle" font-weight="600">Choisir</text>
  </g>
</svg>
