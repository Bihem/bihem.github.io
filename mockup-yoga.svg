<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="yogaHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0EBE3"/>
      <stop offset="100%" stop-color="#E8DDD0"/>
    </linearGradient>
    <linearGradient id="yogaCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D3530"/>
      <stop offset="100%" stop-color="#2A2420"/>
    </linearGradient>
    <clipPath id="yogaClip">
      <rect width="1200" height="900" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#yogaClip)">
    <!-- Background -->
    <rect width="1200" height="900" fill="#FAFAF8"/>

    <!-- NAV -->
    <rect width="1200" height="68" fill="#FAFAF8"/>
    <rect x="0" y="67" width="1200" height="1" fill="#EAE6E0"/>
    <!-- Logo mark -->
    <circle cx="60" cy="34" r="16" fill="none" stroke="#8B7355" stroke-width="1.5"/>
    <line x1="60" y1="20" x2="60" y2="48" stroke="#8B7355" stroke-width="1"/>
    <text x="86" y="31" font-family="'Helvetica Neue',sans-serif" font-size="14" font-weight="300" fill="#2A2420" letter-spacing="4">ZENITH</text>
    <text x="86" y="47" font-family="'Helvetica Neue',sans-serif" font-size="8" fill="#8B7355" letter-spacing="6">YOGA STUDIO</text>
    <!-- Nav -->
    <text x="490" y="40" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="#5A4E44" letter-spacing="3" font-weight="300">COURS</text>
    <text x="580" y="40" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="#5A4E44" letter-spacing="3" font-weight="300">HORAIRES</text>
    <text x="690" y="40" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="#5A4E44" letter-spacing="3" font-weight="300">PROFS</text>
    <text x="780" y="40" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="#5A4E44" letter-spacing="3" font-weight="300">TARIFS</text>
    <text x="870" y="40" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="#5A4E44" letter-spacing="3" font-weight="300">CONTACT</text>
    <rect x="1040" y="22" width="116" height="34" rx="17" fill="#3D3530"/>
    <text x="1098" y="44" font-family="'Helvetica Neue',sans-serif" font-size="10" fill="#FAFAF8" text-anchor="middle" letter-spacing="2" font-weight="300">ESSAI GRATUIT</text>

    <!-- HERO -->
    <rect x="0" y="68" width="1200" height="460" fill="url(#yogaHero)"/>

    <!-- Decorative elements -->
    <circle cx="820" cy="298" r="260" fill="none" stroke="#C4B8A8" stroke-width="1" opacity="0.5"/>
    <circle cx="820" cy="298" r="200" fill="none" stroke="#C4B8A8" stroke-width="0.5" opacity="0.4"/>
    <circle cx="820" cy="298" r="140" fill="#DDD5C8" opacity="0.3"/>

    <!-- Yoga pose silhouette -->
    <!-- Body -->
    <circle cx="820" cy="200" r="22" fill="#3D3530" opacity="0.85"/>
    <!-- Torso -->
    <path d="M820 222 Q800 260 790 300 Q830 280 860 300 Q850 260 820 222" fill="#3D3530" opacity="0.85"/>
    <!-- Arms up (warrior pose) -->
    <path d="M800 245 Q770 220 750 195" stroke="#3D3530" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M840 245 Q870 220 895 195" stroke="#3D3530" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.85"/>
    <!-- Hands -->
    <circle cx="750" cy="193" r="7" fill="#3D3530" opacity="0.85"/>
    <circle cx="895" cy="193" r="7" fill="#3D3530" opacity="0.85"/>
    <!-- Legs -->
    <path d="M790 300 Q775 340 760 380" stroke="#3D3530" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M860 300 Q875 340 900 380" stroke="#3D3530" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.85"/>
    <!-- Feet -->
    <ellipse cx="758" cy="382" rx="12" ry="6" fill="#3D3530" opacity="0.85"/>
    <ellipse cx="902" cy="382" rx="12" ry="6" fill="#3D3530" opacity="0.85"/>

    <!-- Horizontal line decoration -->
    <line x1="120" y1="160" x2="340" y2="160" stroke="#C4B8A8" stroke-width="0.8"/>
    <circle cx="116" cy="160" r="3" fill="#8B7355"/>

    <!-- Hero text -->
    <text x="120" y="210" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="#8B7355" letter-spacing="5" font-weight="300">TROUVEZ VOTRE ÉQUILIBRE</text>
    <text x="118" y="275" font-family="Georgia,serif" font-size="62" fill="#2A2420" letter-spacing="-2">Yoga &amp;</text>
    <text x="118" y="348" font-family="Georgia,serif" font-size="62" fill="#2A2420" font-style="italic">Méditation.</text>

    <text x="120" y="390" font-family="'Helvetica Neue',sans-serif" font-size="14" fill="#8B7355" font-weight="300">Un espace de sérénité pour vous reconnecter</text>
    <text x="120" y="410" font-family="'Helvetica Neue',sans-serif" font-size="14" fill="#8B7355" font-weight="300">à votre corps et à votre souffle.</text>

    <!-- CTA -->
    <rect x="120" y="430" width="200" height="48" rx="24" fill="#3D3530"/>
    <text x="220" y="460" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="#FAFAF8" text-anchor="middle" letter-spacing="2" font-weight="300">COMMENCER</text>
    <text x="342" y="460" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="#8B7355" letter-spacing="2">→ Voir les cours</text>

    <!-- CLASSES SECTION -->
    <rect x="0" y="528" width="1200" height="372" fill="#FAFAF8"/>
    <text x="600" y="578" font-family="'Helvetica Neue',sans-serif" font-size="10" fill="#8B7355" text-anchor="middle" letter-spacing="5" font-weight="300">NOS PRATIQUES</text>
    <text x="600" y="618" font-family="Georgia,serif" font-size="36" fill="#2A2420" text-anchor="middle">Cours &amp; Ateliers</text>

    <!-- Class cards -->
    <!-- Card 1 -->
    <rect x="64" y="645" width="330" height="195" rx="6" fill="#F0EBE3"/>
    <rect x="64" y="645" width="330" height="3" fill="#8B7355"/>
    <text x="100" y="690" font-family="'Helvetica Neue',sans-serif" font-size="9" fill="#8B7355" letter-spacing="4" font-weight="300">DÉBUTANT · 60 MIN</text>
    <text x="100" y="718" font-family="Georgia,serif" font-size="22" fill="#2A2420">Hatha Yoga</text>
    <text x="100" y="744" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#8B7355" font-weight="300">Postures fondamentales,</text>
    <text x="100" y="760" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#8B7355" font-weight="300">respiration, alignement</text>
    <line x1="100" y1="782" x2="364" y2="782" stroke="#C4B8A8" stroke-width="0.8"/>
    <text x="100" y="812" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#2A2420" font-weight="500">18 € / cours</text>
    <text x="364" y="812" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="#3D3530" text-anchor="end">S'inscrire →</text>

    <!-- Card 2 -->
    <rect x="434" y="645" width="330" height="195" rx="6" fill="#3D3530"/>
    <rect x="434" y="645" width="330" height="3" fill="#D4A030"/>
    <text x="470" y="690" font-family="'Helvetica Neue',sans-serif" font-size="9" fill="#D4A030" letter-spacing="4" font-weight="300">INTERMÉDIAIRE · 75 MIN</text>
    <text x="470" y="718" font-family="Georgia,serif" font-size="22" fill="#FAFAF8">Vinyasa Flow</text>
    <text x="470" y="744" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="rgba(250,250,248,0.55)" font-weight="300">Enchaînements fluides,</text>
    <text x="470" y="760" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="rgba(250,250,248,0.55)" font-weight="300">synchronisation souffle-mouvement</text>
    <line x1="470" y1="782" x2="734" y2="782" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    <text x="470" y="812" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#FAFAF8" font-weight="500">22 € / cours</text>
    <text x="734" y="812" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="#D4A030" text-anchor="end">S'inscrire →</text>

    <!-- Card 3 -->
    <rect x="804" y="645" width="330" height="195" rx="6" fill="#F0EBE3"/>
    <rect x="804" y="645" width="330" height="3" fill="#8B7355"/>
    <text x="840" y="690" font-family="'Helvetica Neue',sans-serif" font-size="9" fill="#8B7355" letter-spacing="4" font-weight="300">TOUS NIVEAUX · 45 MIN</text>
    <text x="840" y="718" font-family="Georgia,serif" font-size="22" fill="#2A2420">Méditation</text>
    <text x="840" y="744" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#8B7355" font-weight="300">Pleine conscience, gestion</text>
    <text x="840" y="760" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#8B7355" font-weight="300">du stress, ancrage</text>
    <line x1="840" y1="782" x2="1104" y2="782" stroke="#C4B8A8" stroke-width="0.8"/>
    <text x="840" y="812" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#2A2420" font-weight="500">15 € / cours</text>
    <text x="1104" y="812" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="#3D3530" text-anchor="end">S'inscrire →</text>

    <!-- Bottom strip -->
    <rect x="0" y="860" width="1200" height="40" fill="#2A2420"/>
    <text x="600" y="886" font-family="'Helvetica Neue',sans-serif" font-size="10" fill="rgba(250,250,248,0.35)" text-anchor="middle" letter-spacing="4" font-weight="300">ZENITH YOGA STUDIO · 8 RUE DES ARTS · PARIS · COURS 7J/7</text>
  </g>
</svg>
