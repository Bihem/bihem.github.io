<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudioBooking Acquisition OS</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
@font-face{font-family:'Suisse Intl';src:url('https://cdn.prod.website-files.com/6772f6efe246aaaa73ad2a98/67784f5e4c3068c2e2f22e60_SuisseIntl-Regular.otf')format('opentype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Suisse Intl';src:url('https://cdn.prod.website-files.com/6772f6efe246aaaa73ad2a98/67784f815ee57b4c18bdae11_SuisseIntl-Light.otf')format('opentype');font-weight:300;font-style:normal;font-display:swap}

*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0F0E14;
  --bg2:#16141E;
  --bg3:#1C1927;
  --surface:#16141E;
  --card:#16141E;
  --card2:#1C1927;
  --text:#FFFFFF;
  --off:#B0AABB;
  --dim:rgba(255,255,255,0.55);
  --dim2:rgba(255,255,255,0.28);
  --border:rgba(255,255,255,0.08);
  --border2:rgba(255,255,255,0.16);
  --line:rgba(255,255,255,0.08);
  /* Palette StudioBooking — musique, créativité */
  --a1:#7C5CFF;   /* violet électrique */
  --a2:#FF5C8A;   /* rose */
  --a3:#3ECFAC;   /* vert jade */
  --a4:#FFB340;   /* ambre */
  /* Semantic */
  --accent:#7C5CFF;
  --accent-text:#FFFFFF;
  --accent-dim:rgba(124,92,255,.1);
  --accent-glow:rgba(124,92,255,.25);
  --green:#3ECFAC;
  --green-dim:rgba(62,207,172,.12);
  --orange:#FF9A3C;
  --orange-dim:rgba(255,154,60,.12);
  --red:#FF4D6A;
  --red-dim:rgba(255,77,106,.12);
  --blue:#5B8FFF;
  --blue-dim:rgba(91,143,255,.12);
  --hot:#FF4D6A;
  --hot-dim:rgba(255,77,106,.12);
  --warm:#FF9A3C;
  --warm-dim:rgba(255,154,60,.12);
  --cold:rgba(255,255,255,0.35);
  --cold-dim:rgba(255,255,255,0.06);
  /* Layout */
  --sb-w:240px;--top-h:88px;
  --radius:12px;--radius2:8px;
  --F:'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif;
  --Fs:'Suisse Intl',var(--F);
  --r:12px;
}
/* ══ LIGHT THEME ══ */
html[data-theme="light"]{
  --bg:#F2F0F8;
  --bg2:#FFFFFF;
  --bg3:#EAE7F5;
  --surface:#FFFFFF;
  --card:#FFFFFF;
  --card2:#F0EDF8;
  --text:#1A1730;
  --off:#4A4760;
  --dim:rgba(26,23,48,0.6);
  --dim2:rgba(26,23,48,0.35);
  --border:rgba(0,0,0,0.08);
  --border2:rgba(0,0,0,0.15);
  --line:rgba(0,0,0,0.08);
  --accent:#7C5CFF;
  --accent-text:#FFFFFF;
  --accent-dim:rgba(124,92,255,.08);
  --cold:rgba(0,0,0,0.4);
  --cold-dim:rgba(0,0,0,0.05);
}
html[data-theme="light"] .tb-logo-text{color:#1A1730}
html[data-theme="light"] .gate-logo-text{color:#1A1730}
html[data-theme="light"] .boot-logo-text{color:#1A1730}
html[data-theme="light"] table{background:var(--bg2)}
html[data-theme="light"] .kpi-card.accent{background:rgba(124,92,255,.07)}

body{font-family:var(--F);background:var(--bg);color:var(--text);
  font-size:17px;line-height:1.55;overflow:hidden;height:100vh;
  -webkit-font-smoothing:antialiased;font-weight:400}

/* ══ SB LOGO — texte stylé ══ */
.logo-sb{display:flex;align-items:center;gap:8px;flex-shrink:0}
.logo-sb-mark{width:36px;height:36px;background:var(--a1);border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--Fs);font-size:16px;font-weight:700;color:#fff;letter-spacing:-.02em;
  flex-shrink:0;box-shadow:0 4px 16px rgba(124,92,255,.35)}
.logo-sb-text{font-family:var(--Fs);font-size:15px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;color:var(--text);line-height:1.1}
.logo-sb-sub{font-family:var(--Fs);font-size:9px;font-weight:400;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim2);margin-top:1px}

/* ══ GATE ══ */
#gate{position:fixed;inset:0;background:var(--bg);display:flex;
  align-items:center;justify-content:center;z-index:999;transition:opacity .3s}
.gate-card{background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);padding:52px 44px 44px;width:360px;text-align:center;
  box-shadow:0 24px 80px rgba(0,0,0,.45)}
.gate-logo{margin-bottom:20px;display:flex;justify-content:center}
.gate-logo-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.gate-logo-mark{width:64px;height:64px;background:var(--a1);border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--Fs);font-size:26px;font-weight:700;color:#fff;
  box-shadow:0 8px 32px rgba(124,92,255,.45);margin-bottom:4px}
.gate-logo-text{font-family:var(--Fs);font-size:20px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.gate-sub{font-size:12px;color:var(--dim2);margin-bottom:32px;letter-spacing:.16em;text-transform:uppercase}
#gate-pw{width:100%;background:var(--bg);border:1px solid var(--border);
  color:var(--text);padding:12px 14px;border-radius:100px;font-size:16px;
  font-family:inherit;outline:none;text-align:center;letter-spacing:.1em;
  margin-bottom:12px;transition:border-color .2s}
#gate-pw::placeholder{color:var(--dim2)}
#gate-pw:focus{border-color:var(--a1)}
#gate-btn{width:100%;background:var(--a1);color:#fff;border:none;padding:13px;
  border-radius:100px;font-size:13px;font-weight:700;font-family:var(--Fs);
  cursor:pointer;transition:opacity .15s;letter-spacing:.1em;text-transform:uppercase;
  box-shadow:0 4px 20px rgba(124,92,255,.4)}
#gate-btn:hover{opacity:.85}
.gate-err{font-size:14px;color:var(--red);margin-top:10px;min-height:16px}

/* ══ APP ══ */
#app{display:none;height:100vh;width:100vw;position:relative}

/* ══ SIDEBAR ══ */
#sidebar{position:fixed;left:8px;top:calc(var(--top-h) + 16px);bottom:8px;width:var(--sb-w);
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  display:flex;flex-direction:column;z-index:100;overflow:hidden;
  box-shadow:0 8px 40px rgba(0,0,0,.4);transition:transform .22s cubic-bezier(.4,0,.2,1)}
.sb-section{padding:20px 20px 6px;font-size:11px;font-weight:600;
  letter-spacing:.16em;color:var(--dim2);text-transform:uppercase;font-family:var(--Fs)}
.sb-nav{display:flex;flex-direction:column;gap:1px;padding:0 10px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;
  border-radius:var(--radius2);cursor:pointer;border:none;background:transparent;
  color:var(--dim);font-size:15px;font-family:inherit;font-weight:400;
  text-align:left;width:100%;transition:background .15s,color .15s;position:relative}
.nav-item::before{content:'';display:inline-block;width:2px;height:16px;
  background:transparent;border-radius:2px;flex-shrink:0;
  margin-left:-12px;margin-right:9px;transition:background .15s}
.nav-item:hover{background:rgba(124,92,255,.06);color:var(--text)}
.nav-item.active{background:rgba(124,92,255,.1);color:var(--text);font-weight:500}
.nav-item.active::before{background:var(--a1)}
.nav-ico{font-size:15px;width:18px;text-align:center;flex-shrink:0;opacity:.5}
.nav-item.active .nav-ico,.nav-item:hover .nav-ico{opacity:1}
.nav-badge{margin-left:auto;font-size:12px;font-weight:600;
  background:rgba(255,255,255,.06);color:var(--dim);padding:1px 7px;border-radius:100px}
.nav-badge.hot-badge{background:var(--hot-dim);color:var(--hot)}
.sb-footer{margin-top:auto;padding:16px 20px;border-top:1px solid var(--border)}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--green);margin-right:7px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sb-status{font-size:14px;color:var(--dim);margin-bottom:4px}
.sb-upd{font-size:12px;color:var(--dim2)}

/* ══ TOP BAR ══ */
#topbar{position:fixed;left:10px;right:10px;top:8px;height:var(--top-h);
  background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);
  display:flex;align-items:center;gap:0;padding:0;z-index:200;
  box-shadow:0 8px 40px rgba(0,0,0,.4)}
.tb-brand{display:flex;align-items:center;gap:10px;
  width:var(--sb-w);min-width:var(--sb-w);padding:0 16px 0 20px;flex-shrink:0;
  height:100%;border-radius:var(--radius) 0 0 var(--radius);overflow:hidden}
.tb-center{flex:1;padding:0 16px;display:flex;align-items:center;gap:10px}
.tb-search{position:relative;flex:1;max-width:480px}
.tb-search input{width:100%;background:rgba(124,92,255,.05);
  border:1px solid var(--border);
  color:var(--text);padding:10px 16px 10px 40px;border-radius:100px;font-size:15px;
  font-family:inherit;outline:none;transition:border-color .2s}
.tb-search input::placeholder{color:var(--dim2)}
.tb-search::before{content:'⌕';position:absolute;left:13px;top:50%;
  transform:translateY(-50%);color:var(--dim2);font-size:18px;pointer-events:none}
.tb-search input:focus{border-color:rgba(124,92,255,.4)}
.tb-right{display:flex;align-items:center;gap:8px;flex-shrink:0;padding:0 20px}
.tb-ai-btn{background:var(--a1);color:#fff;border:none;padding:10px 22px;
  border-radius:100px;font-size:13px;font-weight:700;font-family:var(--Fs);
  cursor:pointer;display:flex;align-items:center;gap:6px;transition:opacity .15s;
  letter-spacing:.1em;text-transform:uppercase;box-shadow:0 4px 16px rgba(124,92,255,.35)}
.tb-ai-btn:hover{opacity:.85}
.tb-icon-btn{background:transparent;border:1px solid var(--border);color:var(--dim);
  width:40px;height:40px;border-radius:100px;cursor:pointer;font-size:17px;
  transition:color .15s,border-color .15s;display:flex;align-items:center;justify-content:center}
.tb-icon-btn:hover{color:var(--text);border-color:var(--border2)}
.btn-dl{background:transparent;border:1px solid var(--border);color:var(--dim);
  width:40px;height:40px;border-radius:100px;cursor:pointer;font-size:17px;
  display:flex;align-items:center;justify-content:center;transition:all .18s}
.btn-dl:hover{border-color:var(--border2);color:var(--text)}

/* ══ MAIN CONTENT ══ */
#content{position:fixed;left:calc(var(--sb-w) + 18px);right:0;
  top:calc(var(--top-h) + 14px);bottom:0;
  overflow-y:auto;overflow-x:hidden;padding:28px 32px 48px;
  transition:left .22s cubic-bezier(.4,0,.2,1)}
.view{display:none}
.view.active{display:block}
.view-header{margin-bottom:24px}
.view-title{font-family:var(--Fs);font-size:clamp(38px,4.5vw,58px);letter-spacing:-.02em;
  text-transform:uppercase;line-height:.95;margin-bottom:8px;font-weight:700}
.view-sub{font-size:15px;color:var(--dim);letter-spacing:.04em}

/* ══ KPI GRID ══ */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:22px}
.kpi-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px 24px 20px;transition:border-color .2s,background .2s}
.kpi-card:hover{border-color:var(--border2)}
.kpi-label{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim2);margin-bottom:12px;font-family:var(--Fs)}
.kpi-value{font-family:var(--Fs);font-size:54px;line-height:1;letter-spacing:-.03em;margin-bottom:8px;font-weight:700}
.kpi-sub{font-size:15px;color:var(--dim)}
.kpi-card.accent{background:rgba(124,92,255,.1);border:1px solid rgba(124,92,255,.3);
  box-shadow:0 0 28px rgba(124,92,255,.08)}
.kpi-card.accent .kpi-value{color:var(--a1)}
.kpi-card.accent .kpi-label,.kpi-card.accent .kpi-sub{color:rgba(124,92,255,.75)}
.kpi-card.hot-c{background:rgba(255,77,106,.08);border:1px solid rgba(255,77,106,.25);
  box-shadow:0 0 28px rgba(255,77,106,.06)}
.kpi-card.hot-c .kpi-value{color:var(--hot)}
.kpi-card.hot-c .kpi-label{color:rgba(255,77,106,.7)}
.kpi-card.warm-c{background:rgba(255,154,60,.08);border:1px solid rgba(255,154,60,.25)}
.kpi-card.warm-c .kpi-value{color:var(--warm)}
.kpi-card.warm-c .kpi-label{color:rgba(255,154,60,.7)}
.kpi-card.green-c{background:rgba(62,207,172,.08);border:1px solid rgba(62,207,172,.25)}
.kpi-card.green-c .kpi-value{color:var(--green)}
.kpi-card.green-c .kpi-label{color:rgba(62,207,172,.7)}

/* ══ CARDS ══ */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:22px}
.card:hover{border-color:var(--border2)}
.card-title{font-size:13px;font-weight:600;margin-bottom:18px;color:var(--dim2);
  letter-spacing:.14em;text-transform:uppercase;font-family:var(--Fs)}
.card-hot{background:rgba(255,77,106,.07);border-color:rgba(255,77,106,.22)}
.card-hot .card-title{color:rgba(255,77,106,.65)}
.card-blue{background:rgba(91,143,255,.07);border-color:rgba(91,143,255,.22)}
.card-blue .card-title{color:rgba(91,143,255,.7)}
.card-green{background:rgba(62,207,172,.07);border-color:rgba(62,207,172,.22)}
.card-green .card-title{color:rgba(62,207,172,.7)}
.card-purple{background:rgba(124,92,255,.07);border-color:rgba(124,92,255,.22)}
.card-purple .card-title{color:rgba(124,92,255,.7)}
.card-amber{background:rgba(255,179,64,.07);border-color:rgba(255,179,64,.22)}
.card-amber .card-title{color:rgba(255,179,64,.7)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}

/* ══ TABLE ══ */
.tbl-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;background:var(--bg2)}
th{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim2);padding:11px 20px;text-align:left;background:var(--bg3);
  border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;
  user-select:none;transition:color .15s;font-family:var(--Fs)}
th:hover{color:var(--dim)}
th.sort-asc::after{content:' ↑';color:var(--text)}
th.sort-desc::after{content:' ↓';color:var(--text)}
td{padding:14px 20px;border-bottom:1px solid var(--border);font-size:15px;
  vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(124,92,255,.03)}
.domain-cell{font-weight:500;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.domain-link{color:var(--text);text-decoration:none;transition:color .15s}
.domain-link:hover{color:var(--a1)}

/* ══ SCORE BAR ══ */
.score-wrap{display:flex;align-items:center;gap:8px;min-width:110px}
.score-num{font-size:18px;font-weight:700;width:32px;text-align:right;flex-shrink:0}
.score-bar-bg{flex:1;height:4px;border-radius:2px;background:var(--border);overflow:hidden}
.score-bar-fill{height:100%;border-radius:2px;transition:width .4s}

/* ══ BADGES ══ */
.badge{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;
  border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap}
.badge-hot{background:var(--hot-dim);color:var(--hot);border:1px solid rgba(255,77,106,.2)}
.badge-warm{background:var(--warm-dim);color:var(--warm);border:1px solid rgba(255,154,60,.2)}
.badge-cold{background:var(--cold-dim);color:var(--cold);border:1px solid rgba(107,107,107,.2)}
.badge-queued{background:rgba(124,92,255,.12);color:var(--a1);border:1px solid rgba(124,92,255,.2)}
.badge-emailed{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(91,143,255,.2)}
.badge-replied{background:var(--green-dim);color:var(--green);border:1px solid rgba(62,207,172,.2)}
.badge-bounced{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,77,106,.2)}
.badge-no_email{background:var(--bg);color:var(--dim);border:1px solid var(--border)}
.badge-low_score{background:var(--bg);color:var(--dim2);border:1px solid var(--border)}
.badge-optout{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,77,106,.15);opacity:.7}
.badge-icp{background:var(--bg);color:var(--dim);border:1px solid var(--border);font-size:12.5px}
.badge-booking{background:rgba(62,207,172,.12);color:var(--green);border:1px solid rgba(62,207,172,.2);font-size:12px}
.badge-manual{background:rgba(255,179,64,.12);color:var(--a4);border:1px solid rgba(255,179,64,.2);font-size:12px}
.badge-nobooking{background:rgba(255,77,106,.1);color:var(--hot);border:1px solid rgba(255,77,106,.2);font-size:12px}

/* ══ SIGNAL PILLS ══ */
.signal-pill{display:inline-flex;align-items:center;gap:5px;
  padding:2px 8px;border-radius:20px;font-size:11px}
.signal-high{background:var(--hot-dim);color:var(--hot);border:1px solid rgba(255,77,106,.15)}
.signal-medium{background:var(--orange-dim);color:var(--orange);border:1px solid rgba(255,154,60,.15)}
.signal-low{background:var(--bg);color:var(--dim);border:1px solid var(--border)}

/* ══ PIPELINE STAGES ══ */
.stages-wrap{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;margin-bottom:20px}
.stage-col{min-width:175px;flex-shrink:0}
.stage-header{padding:8px 12px;border-radius:var(--radius2) var(--radius2) 0 0;
  border:1px solid var(--border);border-bottom:none;font-size:12px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  display:flex;justify-content:space-between;align-items:center}
.stage-count{font-size:13px;font-weight:700;padding:1px 7px;border-radius:20px;background:var(--bg)}
.stage-body{background:var(--bg2);border:1px solid var(--border);
  border-radius:0 0 var(--radius2) var(--radius2);padding:8px;min-height:80px;
  display:flex;flex-direction:column;gap:6px}
.stage-card{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-size:14px}
.stage-card-domain{font-weight:600;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage-card-meta{font-size:12px;color:var(--dim)}

/* ══ FUNNEL ══ */
.funnel-wrap{display:flex;flex-direction:column;gap:4px}
.funnel-row{display:flex;align-items:center;gap:10px}
.funnel-label{width:120px;font-size:13px;color:var(--dim);text-align:right;flex-shrink:0}
.funnel-bar-wrap{flex:1;background:var(--bg);border-radius:4px;height:22px;overflow:hidden}
.funnel-bar{height:100%;border-radius:4px;display:flex;align-items:center;
  padding-left:10px;font-size:13px;font-weight:600;transition:width .5s}
.funnel-n{font-size:13px;font-weight:700;width:32px;text-align:right;flex-shrink:0;color:var(--dim)}

/* ══ ICP DISTRIBUTION ══ */
.icp-bar{display:flex;flex-direction:column;gap:8px}
.icp-row{display:flex;align-items:center;gap:10px}
.icp-label{width:180px;font-size:13px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icp-bg{flex:1;background:var(--bg);border-radius:3px;height:5px}
.icp-fill{height:100%;border-radius:3px}
.icp-pct{width:34px;text-align:right;font-size:13px;color:var(--dim)}

/* ══ ACTIVITY FEED ══ */
.feed-list{display:flex;flex-direction:column;gap:0}
.feed-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.feed-item:last-child{border-bottom:none}
.feed-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px}
.feed-body{flex:1;min-width:0}
.feed-main{font-size:15px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.feed-meta{font-size:13px;color:var(--dim2)}

/* ══ CHART ══ */
.chart-wrap{position:relative;width:100%;height:200px}
.chart-wrap-lg{position:relative;width:100%;height:260px}

/* ══ EXPORT BTN ══ */
.btn-export{background:transparent;border:1px solid var(--border);color:var(--dim);
  padding:9px 18px;border-radius:100px;font-size:13px;font-weight:600;
  font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  transition:all .18s;white-space:nowrap}
.btn-export:hover{border-color:var(--green);color:var(--green);background:var(--green-dim)}

/* ══ FILTERS ══ */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filter-bar select,.filter-bar input{background:var(--bg2);border:1px solid var(--border);
  color:var(--text);padding:10px 16px;border-radius:100px;font-size:14px;
  font-family:inherit;outline:none;transition:border-color .2s;cursor:pointer}
.filter-bar select:focus,.filter-bar input:focus{border-color:rgba(124,92,255,.4)}
.filter-bar input{min-width:220px}
.filter-count{font-size:14px;color:var(--dim2);align-self:center;margin-left:auto}

/* ══ COPY CELL ══ */
.copy-cell{display:flex;align-items:center;gap:6px;cursor:pointer;max-width:180px}
.copy-cell:hover .copy-ico{opacity:1}
.copy-ico{opacity:0;transition:opacity .15s;font-size:14px;color:var(--dim)}
.copy-cell.copied .copy-ico::before{content:'✓'}
.copy-cell.copied .copy-ico{opacity:1;color:var(--green)}

/* ══ SEQUENCES ══ */
.seq-flow{display:flex;gap:0;align-items:stretch;margin-bottom:20px;flex-wrap:wrap}
.seq-step{flex:1;min-width:160px;background:var(--bg2);border:1px solid var(--border);
  padding:18px;position:relative}
.seq-step:not(:last-child)::after{content:'→';position:absolute;right:-12px;top:50%;
  transform:translateY(-50%);color:var(--dim2);font-size:16px;z-index:1}
.seq-step:first-child{border-radius:var(--radius) 0 0 var(--radius)}
.seq-step:last-child{border-radius:0 var(--radius) var(--radius) 0}
.seq-step-num{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--dim2);
  text-transform:uppercase;margin-bottom:8px}
.seq-step-name{font-size:17px;font-weight:600;margin-bottom:8px}
.seq-step-meta{font-size:14px;color:var(--dim)}
.seq-step-n{font-family:var(--Fs);font-size:60px;line-height:1;margin-bottom:6px;font-weight:700;letter-spacing:-.03em}

/* ══ AI COPILOT ══ */
#copilot{position:fixed;top:0;right:0;bottom:0;width:340px;background:var(--bg2);
  border-left:1px solid var(--border);z-index:200;transform:translateX(100%);
  transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden}
#copilot.open{transform:translateX(0)}
.cop-header{padding:18px 22px;border-bottom:1px solid var(--border);background:var(--bg3);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.cop-title{font-family:var(--Fs);font-size:14px;letter-spacing:.12em;
  color:var(--text);display:flex;align-items:center;gap:8px;font-weight:600;text-transform:uppercase}
#cop-close{background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--dim);cursor:pointer;
  font-size:16px;padding:5px 12px;border-radius:100px;transition:background .15s,color .15s}
#cop-close:hover{background:rgba(255,255,255,.1);color:var(--text)}
.cop-body{flex:1;overflow-y:auto;padding:18px 22px}
.cop-section{margin-bottom:22px}
.cop-section-title{font-size:11px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim2);margin-bottom:10px;font-family:var(--Fs)}
.cop-item{background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--radius2);padding:12px 14px;margin-bottom:8px}
.cop-item:hover{border-color:var(--border2)}
.cop-item-title{font-size:15px;font-weight:500;margin-bottom:4px}
.cop-item-sub{font-size:14px;color:var(--dim)}
.cop-item-badge{float:right}
.cop-action{background:var(--a1);color:#fff;
  border:none;border-radius:100px;padding:10px 16px;margin-bottom:8px;
  font-size:11px;cursor:pointer;transition:opacity .15s;display:block;
  text-decoration:none;font-weight:700;text-align:center;width:100%;
  letter-spacing:.1em;text-transform:uppercase;font-family:var(--Fs)}
.cop-action:hover{opacity:.85}
.cop-kpi{display:flex;align-items:center;justify-content:space-between;
  padding:8px 0;border-bottom:1px solid var(--border)}
.cop-kpi:last-child{border-bottom:none}
.cop-kpi-lbl{font-size:14px;color:var(--dim)}
.cop-kpi-val{font-family:var(--Fs);font-size:38px;line-height:1;letter-spacing:-.03em;font-weight:700}
.cop-kpi-val.green{color:var(--green)}
.cop-kpi-val.hot{color:var(--hot)}
.cop-ai-bar{display:flex;align-items:center;gap:9px;padding:10px 14px;
  background:rgba(124,92,255,.06);border:1px solid rgba(124,92,255,.15);
  border-radius:var(--radius2);margin-bottom:14px}
.cop-ai-dots{display:flex;gap:3px}
.cop-ai-dot{width:5px;height:5px;border-radius:50%;background:var(--a1);
  animation:aiDot 1.3s ease-in-out infinite}
.cop-ai-dot:nth-child(2){animation-delay:.16s}
.cop-ai-dot:nth-child(3){animation-delay:.32s}
@keyframes aiDot{0%,80%,100%{transform:scale(.6);opacity:.35}40%{transform:scale(1);opacity:1}}
.cop-ai-lbl{font-size:13px;color:var(--dim);flex:1}

/* ══ OVERLAY ══ */
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:150}
#overlay.open{display:block}

/* ══ EMPTY ══ */
.empty{padding:48px;text-align:center;color:var(--dim2)}
.empty-icon{font-size:36px;margin-bottom:12px}

/* ══ TRANSITIONS ══ */
#sidebar,#topbar,.card,.kpi-card,.cop-item,.nav-item{transition:background .18s,border-color .18s,color .18s}

/* ══ SCROLLBAR ══ */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* ══ MOBILE ══ */
@media(max-width:768px){
  :root{--sb-w:0px}
  #sidebar{transform:translateX(-260px);width:240px;left:0;top:calc(var(--top-h)+8px);
    bottom:8px;border-radius:0 16px 16px 0}
  #sidebar.open{transform:translateX(8px)}
  #content{left:0;top:calc(var(--top-h)+14px)}
  #topbar{left:6px;right:6px}
  .tb-brand{width:auto;min-width:auto}
  .two-col,.three-col{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
}

/* ══ BOOT ══ */
#boot{position:fixed;inset:0;background:var(--bg);z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .7s ease,visibility .7s ease}
#boot.fade-out{opacity:0;pointer-events:none;visibility:hidden}
.boot-logo-mark{width:72px;height:72px;background:var(--a1);border-radius:18px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--Fs);font-size:28px;font-weight:700;color:#fff;margin-bottom:16px;
  box-shadow:0 8px 40px rgba(124,92,255,.5);
  animation:bootPulse 2.4s ease-in-out infinite}
@keyframes bootPulse{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
.boot-logo-text{font-family:var(--Fs);font-size:22px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;margin-bottom:4px}
.boot-tag{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim2);margin-bottom:52px;font-family:var(--Fs)}
.boot-bar{width:220px;height:1px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:16px}
.boot-fill{height:100%;background:var(--a1);width:0%;transition:width .4s ease;border-radius:2px}
.boot-msg{font-size:14px;color:var(--dim2);letter-spacing:.07em;text-align:center;min-height:16px}

/* ══ AI INSIGHT ══ */
.ai-insight{border:1px solid rgba(124,92,255,.3);border-radius:var(--radius);
  padding:16px 20px;margin-bottom:22px;position:relative;overflow:hidden;
  background:rgba(124,92,255,.05)}
.ai-insight::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--a1)}
.ai-ins-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ai-ins-lbl{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--a1);font-family:var(--Fs)}
.ai-ins-live{display:flex;align-items:center;gap:5px;margin-left:auto;
  font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim2);padding:2px 10px;border-radius:100px;
  background:rgba(255,255,255,.04);border:1px solid var(--border)}
.ai-ins-live::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--a3);animation:pulse 1.5s infinite;flex-shrink:0}
.ai-ins-txt{font-size:16px;color:var(--text);line-height:1.65;min-height:20px}
.ai-caret{display:inline-block;width:2px;height:14px;background:var(--a1);
  animation:blink .65s step-end infinite;vertical-align:text-bottom;margin-left:2px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ══ AMBIANCE ══ */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:28px 28px}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 700px 500px at 88% 2%,rgba(124,92,255,.05) 0%,transparent 65%),
    radial-gradient(ellipse 500px 600px at 3% 90%,rgba(255,92,138,.03) 0%,transparent 65%),
    radial-gradient(ellipse 360px 360px at 48% 50%,rgba(62,207,172,.02) 0%,transparent 60%)}

/* ══ KPI ANIM ══ */
@keyframes valIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.kpi-value.counting{animation:valIn .4s ease forwards}
</style>
</head>
<body>

<!-- BOOT -->
<div id="boot">
  <div class="boot-logo-mark">SB</div>
  <div class="boot-logo-text">StudioBooking</div>
  <div class="boot-tag">Acquisition Intelligence Platform</div>
  <div class="boot-bar"><div class="boot-fill" id="boot-fill"></div></div>
  <div class="boot-msg" id="boot-msg">Initialisation...</div>
</div>

<!-- GATE -->
<div id="gate" style="display:none">
  <div class="gate-card">
    <div class="gate-logo">
      <div class="gate-logo-wrap">
        <div class="gate-logo-mark">SB</div>
        <div class="gate-logo-text">StudioBooking</div>
      </div>
    </div>
    <div class="gate-sub">Acquisition Intelligence Platform</div>
    <input type="password" id="gate-pw" placeholder="••••••••••••" autocomplete="off">
    <button id="gate-btn" onclick="doAuth()">Accéder →</button>
    <div class="gate-err" id="gate-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <aside id="sidebar">
    <div class="sb-section">Workspace</div>
    <div class="sb-nav">
      <button class="nav-item active" data-view="overview">
        <span class="nav-ico">⬡</span> Overview
      </button>
      <button class="nav-item" data-view="leads">
        <span class="nav-ico">◎</span> Studios
        <span class="nav-badge" id="nb-leads">—</span>
      </button>
      <button class="nav-item" data-view="pipeline">
        <span class="nav-ico">⊞</span> Pipeline
      </button>
      <button class="nav-item" data-view="intelligence">
        <span class="nav-ico">◈</span> Opportunités
        <span class="nav-badge hot-badge" id="nb-hot">—</span>
      </button>
      <button class="nav-item" data-view="sequences">
        <span class="nav-ico">⟳</span> Séquences
      </button>
      <button class="nav-item" data-view="analytics">
        <span class="nav-ico">▦</span> Analytics
      </button>
    </div>
    <div class="sb-section">Outils</div>
    <div class="sb-nav">
      <button class="nav-item" data-view="icp">
        <span class="nav-ico">◆</span> ICP Manager
      </button>
      <button class="nav-item" data-view="saas">
        <span class="nav-ico">🏢</span> Clients SaaS
        <span class="nav-badge" id="nb-saas">—</span>
      </button>
    </div>
    <div class="sb-footer">
      <div class="sb-status"><span class="live-dot"></span>Pipeline actif</div>
      <div class="sb-upd" id="sb-upd">—</div>
    </div>
  </aside>

  <header id="topbar">
    <div class="tb-brand">
      <div class="logo-sb">
        <div class="logo-sb-mark">SB</div>
        <div>
          <div class="logo-sb-text">StudioBooking</div>
          <div class="logo-sb-sub">Acquisition OS</div>
        </div>
      </div>
    </div>
    <div class="tb-center">
      <div class="tb-search">
        <input type="text" id="global-search" placeholder="Rechercher un studio, domaine…" autocomplete="off" oninput="onSearch(this.value)">
      </div>
    </div>
    <div class="tb-right">
      <button class="tb-ai-btn" onclick="toggleCopilot()">✦ Copilot</button>
      <button class="btn-dl" onclick="exportCSV(allProspects)" title="Export CSV" style="font-size:13px">CSV</button>
      <button class="tb-icon-btn" id="theme-btn" onclick="toggleTheme()" title="Thème">🌙</button>
    </div>
  </header>

  <main id="content">
    <section class="view active" id="view-overview"></section>
    <section class="view" id="view-leads"></section>
    <section class="view" id="view-pipeline"></section>
    <section class="view" id="view-intelligence"></section>
    <section class="view" id="view-sequences"></section>
    <section class="view" id="view-analytics"></section>
    <section class="view" id="view-icp"></section>
    <section class="view" id="view-saas"></section>
  </main>

  <div id="copilot">
    <div class="cop-header">
      <div class="cop-title">
        <div style="width:22px;height:22px;background:var(--a1);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff">SB</div>
        AI Copilot
      </div>
      <button id="cop-close" onclick="toggleCopilot()">✕</button>
    </div>
    <div class="cop-body" id="cop-body">
      <div class="empty"><div class="empty-icon">✦</div>Chargement…</div>
    </div>
  </div>
  <div id="overlay" onclick="toggleCopilot()"></div>
</div>

<script>
// ════════════════════════════════════════════════════════
// BOOT
// ════════════════════════════════════════════════════════
const BOOT_MSGS=[
  'Initialisation système...',
  'Connexion au pipeline studios...',
  'Chargement des données...',
  'Analyse des opportunités...',
  'SYSTÈME OPÉRATIONNEL ✦'
];
function runBoot(cb){
  const fill=document.getElementById('boot-fill');
  const msg=document.getElementById('boot-msg');
  const steps=[
    {t:80,  p:14, m:0},{t:460, p:38, m:1},
    {t:880, p:60, m:2},{t:1300,p:82, m:3},{t:1720,p:100,m:4},
  ];
  steps.forEach(s=>setTimeout(()=>{fill.style.width=s.p+'%';msg.textContent=BOOT_MSGS[s.m];},s.t));
  setTimeout(()=>{
    document.getElementById('boot').classList.add('fade-out');
    setTimeout(cb,700);
  },2100);
}

// ════════════════════════════════════════════════════════
// AUTH
// ════════════════════════════════════════════════════════
const PWD='studio2026';
function doAuth(){
  const v=document.getElementById('gate-pw').value.trim();
  if(v===PWD){
    localStorage.setItem('sb_auth','1');
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    init();
  } else {
    document.getElementById('gate-err').textContent='Mot de passe incorrect';
    document.getElementById('gate-pw').style.borderColor='rgba(255,77,106,.5)';
  }
}
document.getElementById('gate-pw').addEventListener('keydown',e=>{if(e.key==='Enter')doAuth()});

(function(){
  const t=localStorage.getItem('sb_theme')||'dark';
  document.documentElement.setAttribute('data-theme',t);
  const btn=document.getElementById('theme-btn');
  if(btn)btn.textContent=t==='light'?'☀️':'🌙';
})();

runBoot(()=>{
  if(localStorage.getItem('sb_auth')==='1'){
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    init();
  } else {
    document.getElementById('gate').style.display='flex';
  }
});

// ════════════════════════════════════════════════════════
// THEME
// ════════════════════════════════════════════════════════
function toggleTheme(){
  const html=document.documentElement;
  const next=html.getAttribute('data-theme')==='light'?'dark':'light';
  html.setAttribute('data-theme',next);
  localStorage.setItem('sb_theme',next);
  const btn=document.getElementById('theme-btn');
  if(btn)btn.textContent=next==='light'?'☀️':'🌙';
  if(allCharts.length)allCharts.forEach(c=>{try{c.destroy()}catch(e){}});
  allCharts=[];
  renderView(currentView);
}

// ════════════════════════════════════════════════════════
// NAVIGATION
// ════════════════════════════════════════════════════════
let currentView='overview';
document.querySelectorAll('.nav-item[data-view]').forEach(btn=>{
  btn.addEventListener('click',()=>switchView(btn.dataset.view));
});
function switchView(v){
  document.querySelectorAll('.view').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-item[data-view]').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelector(`.nav-item[data-view="${v}"]`)?.classList.add('active');
  currentView=v;
  renderView(v);
  document.getElementById('content').scrollTop=0;
}

// ════════════════════════════════════════════════════════
// DATA
// ════════════════════════════════════════════════════════
let CRM={}, DASH={}, SAAS={}, allProspects=[], filteredProspects=[];
let allCharts=[], dataLoaded=false;

async function loadData(){
  try{
    const results=await Promise.allSettled([
      fetch('studiobooking/sb-crm-data.json?t='+Date.now()).then(r=>r.json()),
      fetch('studiobooking/sb-pipeline-data.json?t='+Date.now()).then(r=>r.json()),
      fetch('studiobooking/sb-saas-data.json?t='+Date.now()).then(r=>r.json()),
    ]);
    const [rc,rd,rs]=results;
    const c=rc.status==='fulfilled'?rc.value:{prospects:[]};
    const d=rd.status==='fulfilled'?rd.value:{};
    const s=rs.status==='fulfilled'?rs.value:{summary:{},tenants:[]};
    CRM=c; DASH=d; SAAS=s;
    allProspects=enrichProspects(c.prospects||[]);
    filteredProspects=[...allProspects];
    document.getElementById('nb-leads').textContent=allProspects.length;
    document.getElementById('nb-hot').textContent=allProspects.filter(p=>p.temperature==='hot').length;
    // Badge SaaS = actifs réels
    const saasActive=(s.summary||{}).active||0;
    const saasBadge=document.getElementById('nb-saas');
    if(saasBadge)saasBadge.textContent=saasActive||'—';
    const upd=new Date(c.updated_at||Date.now());
    document.getElementById('sb-upd').textContent='Màj '+upd.toLocaleTimeString('fr',{hour:'2-digit',minute:'2-digit'});
    dataLoaded=true;
    if(typeof buildDynamicInsights==='function'){
      AI_INSIGHTS.length=0;
      buildDynamicInsights().forEach(i=>AI_INSIGHTS.push(i));
    }
  }catch(e){
    console.error('Load error',e);
    const c=document.getElementById('content');
    if(c)c.innerHTML='<div style="padding:48px 32px;text-align:center"><div style="font-size:32px;margin-bottom:16px">⚠️</div><div style="font-size:18px;margin-bottom:8px">Données introuvables</div><div style="font-size:14px;color:var(--dim)">Lancez le pipeline pour générer les fichiers de données</div><button onclick="location.reload()" style="margin-top:24px;padding:10px 24px;border-radius:100px;background:var(--a1);color:#fff;border:none;cursor:pointer;font-size:14px;font-weight:600">Réessayer</button></div>';
  }
}

// ════════════════════════════════════════════════════════
// ICP LABELS & COLORS
// ════════════════════════════════════════════════════════
const ICP_LABELS={
  repetition:'Studio de Répétition',
  enregistrement:"Studio d'Enregistrement",
  smac_venue:'SMAC / Salle de Spectacle',
  residence:'Résidence Artistique',
  multi_service:'Multi-services Musique',
  autre_studio:'Autre Studio',
};
const ICP_COLORS={
  repetition:'#7C5CFF',
  enregistrement:'#FF5C8A',
  smac_venue:'#FF4D6A',
  residence:'#3ECFAC',
  multi_service:'#FFB340',
  autre_studio:'#64748b',
};

function enrichProspects(ps){
  return ps.map(p=>{
    const icp=p.icp_category||'autre_studio';
    const icp_label=p.icp_label||ICP_LABELS[icp]||icp;
    const score=p.ai_score||p.score||0;
    const temp=p.temperature||(score>=65?'hot':score>=45?'warm':'cold');
    return{...p,ai_score:score,score,temperature:temp,icp_category:icp,icp_label};
  });
}

// ════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════
const cV=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function tempBadge(t){
  const m={hot:'🔥 HOT',warm:'🌡 WARM',cold:'❄ COLD'};
  return`<span class="badge badge-${t}">${m[t]||t}</span>`;
}
function statusBadge(s){
  const labels={queued:'En file',emailed_1:'Email 1',emailed_2:'Email 2',emailed_3:'Dernière relance',
    replied:'Répondu ✓',bounced:'Bounce',no_email:'Sans email',low_score:'Score bas',
    optout:'Opt-out'};
  return`<span class="badge badge-${s.replace(/[^a-z_]/g,'')}">${labels[s]||s}</span>`;
}
function bookingBadge(p){
  if(p.has_booking===1||p.has_booking===true)
    return`<span class="badge-booking badge">✅ Déjà équipé</span>`;
  if(p.manual_booking===1||p.manual_booking===true)
    return`<span class="badge-manual badge">📞 Manuel</span>`;
  return`<span class="badge-nobooking badge">❌ Pas de résa</span>`;
}
function scoreBar(n,color){
  const c=color||`hsl(${(1-(n/100))*120|0},65%,50%)`;
  return`<div class="score-wrap">
    <span class="score-num" style="color:${c}">${n}</span>
    <div class="score-bar-bg"><div class="score-bar-fill" style="width:${n}%;background:${c}"></div></div>
  </div>`;
}
function scoreColor(n){return n>=65?cV('--hot'):n>=45?cV('--warm'):cV('--cold')}
function fDate(s){if(!s)return'—';try{return new Date(s).toLocaleDateString('fr',{day:'2-digit',month:'2-digit'})}catch{return s}}
function copyVal(el,v){navigator.clipboard?.writeText(v).then(()=>{el.classList.add('copied');setTimeout(()=>el.classList.remove('copied'),1800)}).catch(()=>{})}
function makeChart(id,cfg){
  const c=document.getElementById(id);if(!c)return;
  try{const chart=new Chart(c,cfg);allCharts.push(chart);return chart;}catch(e){console.warn(e)}
}

function onSearch(q){
  q=q.toLowerCase().trim();
  if(!q){filteredProspects=[...allProspects];}
  else{filteredProspects=allProspects.filter(p=>
    (p.domain||'').includes(q)||(p.company||'').toLowerCase().includes(q)||
    (p.email||'').includes(q)||(p.icp_label||'').toLowerCase().includes(q));}
  if(currentView==='leads')renderLeads();
}

let leadSort={col:'ai_score',dir:'desc'};
let leadFilters={status:'',source:'',icp:'',temp:'',booking:''};

function renderLeads(){
  const ps=applyLeadFilters(filteredProspects);
  const sources=[...new Set(allProspects.map(p=>p.source).filter(Boolean))];
  const icps=[...new Set(allProspects.map(p=>p.icp_category).filter(Boolean))];

  const rows=ps.length?ps.map(p=>{
    const ai=p.ai_score||0;
    const sc=scoreColor(ai);
    const em=p.email?`<div class="copy-cell" onclick="copyVal(this,'${(p.email||'').replace(/'/g,"\\'")}')">
      <span>${p.email.split('@')[0]}@…</span><span class="copy-ico">⎘</span></div>`:
      '<span style="color:var(--dim2)">—</span>';
    const ph=p.phone?`<div class="copy-cell" onclick="copyVal(this,'${(p.phone||'').replace(/'/g,"\\'")}')">
      <span>${p.phone}</span><span class="copy-ico">⎘</span></div>`:
      '<span style="color:var(--dim2)">—</span>';
    return`<tr>
      <td>${scoreBar(ai,sc)}</td>
      <td class="domain-cell"><a class="domain-link" href="https://${p.domain}" target="_blank" rel="noopener">${p.domain}</a></td>
      <td>${tempBadge(p.temperature)}</td>
      <td>${bookingBadge(p)}</td>
      <td><span class="badge badge-icp" style="border-color:${ICP_COLORS[p.icp_category]||''}20;color:${ICP_COLORS[p.icp_category]||cV('--dim')}">${p.icp_label||'—'}</span></td>
      <td>${statusBadge(p.status||'no_email')}</td>
      <td>${em}</td>
      <td>${ph}</td>
      <td style="color:var(--dim2)">${fDate(p.date_added)}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="9" class="empty">Aucun studio trouvé</td></tr>`;

  const thSort=(col,label)=>{
    const cls=leadSort.col===col?(leadSort.dir==='asc'?'sort-asc':'sort-desc'):'';
    return`<th class="${cls}" onclick="sortLeads('${col}')">${label}</th>`;
  };

  document.getElementById('view-leads').innerHTML=`
  <div class="view-header">
    <div class="view-title">Studios</div>
    <div class="view-sub">${ps.length} studios · triés par score d'opportunité</div>
  </div>
  <div class="filter-bar">
    <input placeholder="Chercher studio, domaine…" oninput="onSearch(this.value)">
    <select onchange="leadFilters.temp=this.value;renderLeads()">
      <option value="">Toutes températures</option>
      <option value="hot">🔥 HOT</option>
      <option value="warm">🌡 WARM</option>
      <option value="cold">❄ COLD</option>
    </select>
    <select onchange="leadFilters.icp=this.value;renderLeads()">
      <option value="">Tous types</option>
      ${icps.map(i=>`<option value="${i}">${ICP_LABELS[i]||i}</option>`).join('')}
    </select>
    <select onchange="leadFilters.status=this.value;renderLeads()">
      <option value="">Tous statuts</option>
      ${['queued','emailed_1','emailed_2','replied','bounced','no_email','low_score'].map(s=>
        `<option value="${s}">${s}</option>`).join('')}
    </select>
    <select onchange="leadFilters.source=this.value;renderLeads()">
      <option value="">Toutes sources</option>
      ${sources.map(s=>`<option value="${s}">${s}</option>`).join('')}
    </select>
    <span class="filter-count">${ps.length} résultats</span>
    <button class="btn-export" onclick="exportCSV(applyLeadFilters(filteredProspects))">⬇ Export CSV</button>
  </div>
  <div class="tbl-wrap">
    <table>
      <thead><tr>
        ${thSort('ai_score','Score')}
        ${thSort('domain','Domaine')}
        <th>Temp.</th>
        <th>Réservation</th>
        <th>Type Studio</th>
        <th>Statut</th>
        <th>Email</th>
        <th>Tél</th>
        <th>Date</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function applyLeadFilters(ps){
  let r=[...ps];
  if(leadFilters.temp)r=r.filter(p=>p.temperature===leadFilters.temp);
  if(leadFilters.icp) r=r.filter(p=>p.icp_category===leadFilters.icp);
  if(leadFilters.status)r=r.filter(p=>p.status===leadFilters.status);
  if(leadFilters.source)r=r.filter(p=>p.source===leadFilters.source);
  r.sort((a,b)=>{
    let va=a[leadSort.col],vb=b[leadSort.col];
    if(typeof va==='string')va=va.toLowerCase();
    if(typeof vb==='string')vb=vb.toLowerCase();
    if(va==null)return 1; if(vb==null)return -1;
    return leadSort.dir==='asc'?va>vb?1:-1:va<vb?1:-1;
  });
  return r;
}
function sortLeads(col){
  leadSort.dir=leadSort.col===col&&leadSort.dir==='desc'?'asc':'desc';
  leadSort.col=col;renderLeads();
}

const STAGES=[

  {key:'low_score',label:'Déjà équipé',color:'#475569'},
  {key:'queued',label:'En file 📬',color:'#7C5CFF'},
  {key:'emailed_1',label:'Email 1 envoyé',color:'#5B8FFF'},
  {key:'emailed_2',label:'Relance J+4',color:'#FF9A3C'},
  {key:'emailed_3',label:'Clôture J+8',color:'#FF5C8A'},
  {key:'replied',label:'A répondu 💬',color:'#3ECFAC'},
  {key:'hot_lead',label:'Lead Chaud 🔥',color:'#FF4D6A'},
  {key:'client',label:'Client ✅',color:'#22c55e'},
];

function renderPipeline(){
  const stageMap={};
  STAGES.forEach(s=>stageMap[s.key]=[]);
  allProspects.forEach(p=>{
    const s=p.status||'no_email';
    if(stageMap[s])stageMap[s].push(p);
    else stageMap['no_email'].push(p);
  });
  stageMap['hot_lead']=allProspects.filter(p=>p.temperature==='hot'&&(p.status||'').startsWith('emailed'));

  const cols=STAGES.map(st=>{
    const ps=stageMap[st.key]||[];
    const cards=ps.slice(0,4).map(p=>`
      <div class="stage-card">
        <div class="stage-card-domain">${p.domain}</div>
        <div class="stage-card-meta">${ICP_LABELS[p.icp_category]||p.icp_category||'—'} · ${scoreBar(p.ai_score,scoreColor(p.ai_score))}</div>
      </div>`).join('');
    const more=ps.length>4?`<div style="font-size:11px;color:var(--dim2);padding:4px 6px">+${ps.length-4} autres</div>`:'';
    return`<div class="stage-col">
      <div class="stage-header" style="border-color:${st.color}30;background:${st.color}0d">
        <span style="color:${st.color};font-size:11px">${st.label}</span>
        <span class="stage-count" style="background:${st.color}20;color:${st.color}">${ps.length}</span>
      </div>
      <div class="stage-body">${cards||'<div style="font-size:11px;color:var(--dim2);padding:6px">Vide</div>'}${more}</div>
    </div>`;
  }).join('');

  document.getElementById('view-pipeline').innerHTML=`
  <div class="view-header">
    <div class="view-title">Pipeline Visuel</div>
    <div class="view-sub">${STAGES.length} étapes · ${allProspects.length} studios</div>
  </div>
  <div class="stages-wrap">${cols}</div>
  <div class="card">
    <div class="card-title">Top 5 opportunités</div>
    ${[...allProspects].filter(p=>!p.has_booking&&p.email).sort((a,b)=>b.ai_score-a.ai_score).slice(0,5).map((p,i)=>`
      <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:10px;color:var(--dim2);width:16px">#${i+1}</span>
        <span style="flex:1;font-size:13px;font-weight:500">${p.domain}</span>
        ${bookingBadge(p)}
        ${scoreBar(p.ai_score,scoreColor(p.ai_score))}
      </div>`).join('')||'<div class="empty">Aucune</div>'}
  </div>`;
}

// ════════════════════════════════════════════════════════
function renderSequences(){
  const f=DASH.funnel||{};
  const ab=DASH.ab_test||{};
  const s1=allProspects.filter(p=>p.status==='queued');
  const s2=allProspects.filter(p=>p.status==='emailed_1');
  const s3=allProspects.filter(p=>p.status==='emailed_2');
  const replied=allProspects.filter(p=>p.replied===1||p.replied===true);
  const aA=ab.A||{sent:0,replied:0},aB=ab.B||{sent:0,replied:0};

// EXPORT CSV
// ════════════════════════════════════════════════════════
function exportCSV(prospects){
  if(!prospects||!prospects.length){alert('Aucun studio à exporter.');return;}
  const cols=['domain','company','temperature','ai_score','icp_category','source',
    'email','phone','status','has_booking','manual_booking','notes'];
  const headers=['Domaine','Studio','Temp.','Score','Type','Source',
    'Email','Téléphone','Statut','Résa Online','Résa Manuel','Notes'];
  const rows=[headers.join(',')];
  prospects.forEach(p=>{
    const row=cols.map(k=>{
      const v=p[k]!=null?String(p[k]):'';
      return v.includes(',')||v.includes('"')||v.includes('\n')?'"'+v.replace(/"/g,'""')+'"':v;
    });
    rows.push(row.join(','));
  });
  const csv='﻿'+rows.join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`studiobooking-studios-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1000);
}

// AI INSIGHTS — spécifiques studios
// ════════════════════════════════════════════════════════
function buildDynamicInsights(){
  const ps=allProspects;
  const total=ps.length;
  const hot=ps.filter(p=>p.temperature==='hot');
  const noBooking=ps.filter(p=>!p.has_booking&&p.email);
  const manual=ps.filter(p=>p.manual_booking);
  const emailed=ps.filter(p=>p.status&&p.status.startsWith('emailed'));
  const f=DASH.funnel||{};
  const replyRate=f.total_emailed?((f.total_replied||0)/f.total_emailed*100).toFixed(1):0;
  const today=new Date().toISOString().slice(0,10);
  const toRelance=emailed.filter(p=>p.next_action&&p.next_action<=today&&!p.replied&&!p.bounced);

  const icpC={};
  ps.forEach(p=>{const k=p.icp_category||'autre_studio';icpC[k]=(icpC[k]||0)+1});
  const topICP=Object.entries(icpC).sort((a,b)=>b[1]-a[1])[0];

  const insights=[];

  if(noBooking.length>0){
    insights.push(`${noBooking.length} studio${noBooking.length>1?'s n\'ont':'n\'a'} pas de système de réservation en ligne — ${noBooking[0].domain} est votre priorité absolue. C'est la cible directe de StudioBooking.`);
  }
  if(hot.length>0){
    insights.push(`${hot.length} prospect${hot.length>1?'s HOT identifiés':'HOT identifié'} — ${hot[0].domain} (score ${hot[0].ai_score}) est prêt à être contacté. Agissez dans les 24h.`);
  }
  if(manual.length>0){
    insights.push(`${manual.length} studio${manual.length>1?'s gèrent':'gère'} encore les réservations par téléphone — signal extrêmement fort. Ces studios perdent 15-20% de leurs créneaux en no-shows chaque mois.`);
  }
  if(toRelance.length>0){
    insights.push(`${toRelance.length} studio${toRelance.length>1?'s ont':'a'} atteint la fenêtre de relance (J+4) — ${toRelance[0].domain} en tête. La relance double le taux de réponse.`);
  }
  if(topICP&&topICP[1]>1){
    const pct=Math.round(topICP[1]/total*100);
    insights.push(`${pct}% de vos prospects sont des ${ICP_LABELS[topICP[0]]||topICP[0]}. Personnalisez votre pitch avec des cas concrets de ce type de structure.`);
  }
  if(emailed.length>0&&replyRate==0){
    insights.push(`${emailed.length} emails envoyés, 0 réponse. Testez l'objet "Combien de no-shows par mois ?" — une question directe convertit mieux qu'une affirmation.`);
  }
  if(total===0){
    insights.push(`Pipeline vide — le premier run automatique s'effectuera demain à 09h00. Les studios de répétition et SMAC sont en cours de découverte.`);
  }

  return insights.length?insights:['Chargement des insights en cours...'];
}
const AI_INSIGHTS=buildDynamicInsights();
let _insIdx=0,_insHandle=null;
function startInsightCycle(){
  clearTimeout(_insHandle);
  _typeInsight(AI_INSIGHTS[_insIdx%AI_INSIGHTS.length],()=>{
    _insHandle=setTimeout(()=>{_insIdx++;startInsightCycle();},3200);
  });
}
function _typeInsight(text,onDone){
  const el=document.getElementById('ai-ins-txt');
  if(!el)return;
  let i=0;const caret='<span class="ai-caret"></span>';
  el.innerHTML=caret;
  const tick=()=>{
    const el2=document.getElementById('ai-ins-txt');
    if(!el2)return;
    if(i<=text.length){el2.innerHTML=text.slice(0,i)+caret;i++;setTimeout(tick,18);}
    else{if(onDone)onDone();}
  };
  setTimeout(tick,30);
}

// ════════════════════════════════════════════════════════
// KPI ANIMATION
// ════════════════════════════════════════════════════════
function animateKPIs(containerId){
  const els=document.querySelectorAll('#'+containerId+' .kpi-value[data-val]');
  els.forEach((el,i)=>{
    const target=parseInt(el.dataset.val)||0;
    el.classList.add('counting');
    let cur=0;const steps=22;const inc=target/steps;let n=0;
    const run=()=>{
      n++;cur=Math.min(cur+inc,target);
      el.textContent=Math.round(cur);
      if(n<steps)setTimeout(run,20);else el.textContent=target;
    };
    setTimeout(run,60+i*45);
  });
}

// ════════════════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════════════════
function buildICPDist(){
  const counts={};
  allProspects.forEach(p=>{const c=p.icp_category||'autre_studio';counts[c]=(counts[c]||0)+1;});
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({
    category:k,label:ICP_LABELS[k]||k,count:v,
    pct:Math.round(v/Math.max(1,allProspects.length)*100)
  }));
}

// ════════════════════════════════════════════════════════
// RENDER ROUTER
// ════════════════════════════════════════════════════════
// ════════════════════════════════════════════════════════
// VIEW: CLIENTS SAAS
// ════════════════════════════════════════════════════════
function renderSaas(){
  const s=SAAS||{};
  const summary=s.summary||{total:0,active:0,trial:0,suspended:0,paying:0};
  const tenants=s.tenants||[];
  const upd=s.updated_at?new Date(s.updated_at).toLocaleString('fr',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';

  const statusBadge=(status,paying)=>{
    if(status==='active'&&paying) return`<span style="background:#22c55e22;color:#22c55e;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:600">💳 Payant</span>`;
    if(status==='active')         return`<span style="background:#7C5CFF22;color:#7C5CFF;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:600">✅ Actif</span>`;
    if(status==='trial')          return`<span style="background:#FFB34022;color:#FFB340;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:600">⏳ Trial</span>`;
    return`<span style="background:#64748b22;color:#64748b;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:600">Suspendu</span>`;
  };

  const rows=tenants.length?tenants.map(t=>{
    const date=t.created_at?new Date(t.created_at).toLocaleDateString('fr'):'—';
    return`
    <div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)">
      <div style="width:36px;height:36px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--a1);flex-shrink:0">${(t.name||t.slug).substring(0,2).toUpperCase()}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.name||t.slug}</div>
        <div style="font-size:12px;color:var(--dim)">studiobooking.fr/admin/${t.slug} · ${date}</div>
      </div>
      <div style="flex-shrink:0">${statusBadge(t.status,t.paying)}</div>
      <div style="font-size:12px;color:var(--dim);flex-shrink:0;width:60px;text-align:right">${t.plan||'starter'}</div>
    </div>`}).join('')
    :`<div class="empty" style="padding:32px">Aucun client inscrit</div>`;

  document.getElementById('view-saas').innerHTML=`
  <div class="view-header">
    <div class="view-title">Clients SaaS</div>
    <div class="view-sub">Màj ${upd} · ${summary.total} studios inscrits</div>
  </div>
  <div class="three-col" style="margin-bottom:20px">
    <div class="kpi-card hot-c">
      <div class="kpi-label">Actifs 🟢</div>
      <div class="kpi-value" data-val="${summary.active}">${summary.active}</div>
      <div class="kpi-sub">${summary.paying} payant${summary.paying>1?'s':''}</div>
    </div>
    <div class="kpi-card warm-c">
      <div class="kpi-label">En trial ⏳</div>
      <div class="kpi-value" data-val="${summary.trial}">${summary.trial}</div>
      <div class="kpi-sub">à convertir</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Total inscrits</div>
      <div class="kpi-value" data-val="${summary.total}">${summary.total}</div>
      <div class="kpi-sub">${summary.suspended||0} suspendu${(summary.suspended||0)>1?'s':''}</div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Studios inscrits (hors comptes internes)</div>
    ${rows}
  </div>
  ${summary.paying===0&&summary.total>0?`
  <div class="card" style="border-left:3px solid var(--warm)">
    <div class="card-title">⚡ Action recommandée</div>
    <div style="font-size:13px;color:var(--dim);margin-top:8px">
      ${summary.trial} studio${summary.trial>1?'s':''} en trial — relancer avec un email de conversion ou un lien Stripe direct.
    </div>
  </div>`:''}`;
}

function renderView(v){
  if(!dataLoaded)return;
  const map={overview:renderOverview,leads:renderLeads,pipeline:renderPipeline,
    intelligence:renderIntelligence,sequences:renderSequences,
    analytics:renderAnalytics,icp:renderICP,saas:renderSaas};
  map[v]?.();
}

// ════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════
async function init(){
  await loadData();
  renderView('overview');
  setInterval(async()=>{
    if(localStorage.getItem('sb_auth')==='1'){
      allCharts.forEach(c=>{try{c.destroy()}catch(e){}});
      allCharts=[];
      await loadData();
      renderView(currentView);
    }
  },300000);
}

document.addEventListener('keydown',e=>{
  if(e.key==='c'&&!e.ctrlKey&&!e.metaKey&&document.activeElement.tagName!=='INPUT')
    toggleCopilot();
});
</script>
